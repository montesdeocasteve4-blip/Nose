<!doctype html><html lang="es"><head><meta charset="utf-8">

<title>Guerrero Carmesí</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Rajdhani:wght@500;700&display=swap">
<style>
/* Mundo único oscuro: HUD de cristal ahumado, acento carmesí, oro para aguante y recompensas */
:root{--ink:#ffe2dc;--dim:#d0a2a0;--red:#ff4a3a;--gold:#ffc94a;--glass:rgba(18,4,8,.62);--line:rgba(255,80,70,.3);--disp:'Cinzel',Georgia,serif;--ui:'Rajdhani','Segoe UI',system-ui,sans-serif;color-scheme:dark}
html,body{margin:0;height:100%;background:#000;color:var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-family:var(--ui)}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
button{font-family:var(--ui);cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#panel{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));padding:8px 10px;width:min(240px,46vw);display:grid;gap:5px;pointer-events:none;box-sizing:border-box}
.row{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:6px}
.lb{font-size:10px;letter-spacing:.14em;color:var(--dim);font-weight:700}
.bar{position:relative;height:9px;border-radius:5px;background:rgba(0,0,0,.6);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;border-radius:inherit;transition:width .12s}
.hp{height:14px}.hp i{background:linear-gradient(90deg,#7a0010,#ff2d2d,#ff8a6a)}
.bar em{position:absolute;inset:0;font-style:normal;font-size:11px;font-weight:700;line-height:14px;text-align:center;color:#fff;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.st i{background:linear-gradient(90deg,#8a5a00,#ffc94a,#fff0b0)}
.st.low i{background:linear-gradient(90deg,#4a3410,#8a6a30)}
.st.flash{animation:fl .35s 2}
@keyframes fl{50%{box-shadow:0 0 0 2px var(--gold),0 0 12px var(--gold)}}
.pw i{background:linear-gradient(90deg,#5a0010,#ff3a2a,#fff)}
#chain{display:flex;gap:7px;padding-left:2px}
#chain b{width:9px;height:9px;transform:rotate(45deg);border:1px solid #ff6a5a;background:transparent;transition:background .1s}
#chain b.on{background:var(--red);box-shadow:0 0 8px #f33}
#chain b.fin.on{background:var(--gold);box-shadow:0 0 10px #fc4;border-color:var(--gold)}
#buffs{display:flex;gap:4px;flex-wrap:wrap}
#buffs:empty{display:none}
#buffs span{font-size:10px;font-weight:700;letter-spacing:.08em;padding:1px 7px;border-radius:999px;background:rgba(255,60,40,.22);border:1px solid rgba(255,90,70,.5)}
#buffs .cr{background:rgba(255,200,80,.2);border-color:var(--gold);color:var(--gold)}
#stat{position:fixed;right:calc(max(10px,env(safe-area-inset-right)) + 50px);top:max(8px,env(safe-area-inset-top));padding:6px 12px;text-align:right;pointer-events:none;min-width:84px}
#wv{font-family:var(--disp);font-size:12px;letter-spacing:.12em;color:#ff8a7a}
#sc{font-size:24px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
#cb{font-size:12px;font-weight:700;color:var(--gold);min-height:15px}
#fs{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:#ffb3a8;font-size:20px}
#abil{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:12px;padding:8px 12px 12px;pointer-events:none}
.ab{position:relative;width:50px;height:50px;border-radius:12px;display:grid;place-items:center;background:rgba(50,6,12,.75);border:1px solid var(--line);color:#ffb3a8}
.ab kbd{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font:700 10px var(--ui);padding:0 5px;border-radius:4px;background:#2a0508;border:1px solid var(--line);color:var(--ink);z-index:1}
.ab svg,.b svg{width:48%;height:48%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cdv::after{content:'';position:absolute;inset:0;border-radius:inherit;background:conic-gradient(rgba(0,0,0,.72) calc(var(--cd,0)*360deg),transparent 0);pointer-events:none}
.low{color:#6a4a48!important;border-color:rgba(120,80,80,.4)!important}
.b{position:fixed;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:78px;height:78px;padding:0;border-radius:50%;border:1.5px solid rgba(255,90,70,.6);background:radial-gradient(circle at 50% 35%,rgba(130,12,22,.8),rgba(28,2,6,.8));color:#ffd0c8;font-size:10px;font-weight:700;letter-spacing:.1em;touch-action:none;-webkit-appearance:none;box-shadow:0 0 18px rgba(255,30,30,.22)}
.b svg{width:40%;height:40%}
.b:active{transform:scale(.94);border-color:#ff7a6a}
#atk{width:100px;height:100px;font-size:11px;right:calc(max(16px,env(safe-area-inset-right)) + 6px);bottom:calc(max(18px,env(safe-area-inset-bottom)) + 8px)}
#dsh{right:calc(max(16px,env(safe-area-inset-right)) + 122px);bottom:max(18px,env(safe-area-inset-bottom))}
#pow{right:calc(max(16px,env(safe-area-inset-right)) + 26px);bottom:calc(max(18px,env(safe-area-inset-bottom)) + 124px)}
#fea{right:calc(max(16px,env(safe-area-inset-right)) + 122px);bottom:calc(max(18px,env(safe-area-inset-bottom)) + 100px)}
#joy{position:fixed;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;border:1.5px solid rgba(255,90,70,.5);background:radial-gradient(circle,rgba(255,40,30,.12),rgba(0,0,0,.18));display:none;pointer-events:none}
#knob{position:absolute;left:39px;top:39px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff8a6a,#a0101a);box-shadow:0 0 14px rgba(255,40,30,.6)}
#banner{position:fixed;left:0;right:0;top:17%;text-align:center;font:800 clamp(26px,6vw,40px) var(--disp);letter-spacing:.2em;color:#ff5a48;text-shadow:0 0 20px #f00;opacity:0;transition:opacity .5s;pointer-events:none}
#tip{position:fixed;left:50%;top:27%;transform:translateX(-50%);max-width:min(460px,80vw);padding:8px 14px;font-size:14px;line-height:1.35;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
#tip b{color:var(--gold)}
#over{position:fixed;inset:0;z-index:5;display:flex;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s,visibility 0s .5s;overflow:auto;touch-action:pan-y;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));box-sizing:border-box;background:radial-gradient(ellipse at 50% 30%,rgba(60,4,12,.84),rgba(0,0,0,.93))}
#over.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .5s}
#mm{width:min(720px,100%);margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
#mm h1{font:800 clamp(26px,6vw,44px)/1.05 var(--disp);letter-spacing:.08em;margin:0;text-align:center;color:#ff5a48;text-shadow:0 0 24px rgba(255,40,30,.6);text-wrap:balance}
#mm .sub{margin:0;color:var(--dim);font-size:15px;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips span{padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,40,30,.08);font-size:14px}
.chips b{color:var(--gold);font-variant-numeric:tabular-nums}
#mm h2{font:700 12px var(--ui);letter-spacing:.2em;color:var(--dim);margin:6px 0 0;align-self:flex-start}
#shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px;width:100%}
.sc{display:grid;grid-template-columns:1fr auto;gap:3px 8px;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(64,8,14,.75),rgba(20,3,6,.75));color:var(--ink)}
.sc .n,.uc .n{font-weight:700;font-size:15px}
.sc .cost{font-weight:700;color:var(--gold);font-size:13px;white-space:nowrap}
.sc .d{grid-column:1/3;font-size:12px;color:var(--dim)}
.pips{grid-column:1/3;display:flex;gap:3px}
.pips i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
.pips i.on{background:var(--red);box-shadow:0 0 6px #f33}
.sc:disabled{opacity:.42;cursor:default}
.sc:not(:disabled):hover,.uc:hover{border-color:#ff7a6a;box-shadow:0 0 16px rgba(255,40,30,.3)}
#cards .go,.go{margin-top:4px;padding:13px 54px;border-radius:12px;border:1px solid #ff6a5a;background:linear-gradient(180deg,#b3121c,#5a040c);color:#fff;font:700 18px var(--disp);letter-spacing:.14em;box-shadow:0 0 24px rgba(255,30,30,.45)}
.how{width:100%;font-size:13px;color:var(--dim)}
.how summary{cursor:pointer;color:var(--ink);letter-spacing:.12em;font-weight:700}
.how ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;line-height:1.35}
.how b{color:var(--ink)}
#cards{position:fixed;inset:0;z-index:6;display:flex;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s,visibility 0s .5s;flex-direction:column;align-items:center;gap:12px;padding:16px;box-sizing:border-box;background:rgba(0,0,0,.8);overflow:auto;touch-action:pan-y}
.ph{font:700 12px var(--ui);letter-spacing:.2em;color:var(--dim);margin:2px 0 -4px}
#cards.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .5s}
#cards>:first-child{margin-top:auto}#cards>:last-child{margin-bottom:auto}
.uc.s{width:min(190px,44vw);padding:8px 10px;gap:3px}.uc.s .n{font-size:14px}.uc.got{border-color:var(--gold);box-shadow:0 0 16px rgba(255,200,80,.35)}
.ct{font:700 22px var(--disp);letter-spacing:.12em;color:#ff6a5a;text-align:center}
.cl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.uc{position:relative;width:min(220px,86vw);display:flex;flex-direction:column;gap:7px;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(74,8,16,.88),rgba(18,3,6,.88));color:var(--ink)}
.uc .n{font-size:17px;color:#ff8a6a;padding-right:18px}
.uc .d{font-size:13px;color:var(--dim)}
.uc kbd{position:absolute;top:10px;right:12px;font:700 12px var(--ui);color:var(--dim)}
#met{right:calc(max(16px,env(safe-area-inset-right)) + 210px);bottom:calc(max(18px,env(safe-area-inset-bottom)) + 100px)}
.gv{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;font-size:14px}
#toast{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 66px);transform:translateX(-50%);padding:8px 16px;font-size:14px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;z-index:9;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast b{color:var(--gold)}
#bt{position:fixed;right:max(10px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 48px);width:40px;height:40px;z-index:8;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:#ffb3a8;display:grid;place-items:center;padding:0}
#bt svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bt.new::after{content:'';position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:pl 1s infinite alternate}
@keyframes pl{to{transform:scale(1.5)}}
#bes{position:fixed;z-index:8;right:max(10px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 96px);width:min(340px,calc(100vw - 20px));max-height:calc(100vh - 110px);max-height:calc(100dvh - 110px);overflow:auto;padding:12px 14px;display:none;box-sizing:border-box;touch-action:pan-y;background:rgba(14,3,6,.92)}
#bes h3{font:700 14px var(--disp);letter-spacing:.14em;color:#ff6a5a;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;color:var(--dim);font-size:18px;padding:2px 6px}
.be{border-top:1px solid var(--line);padding:8px 0;font-size:13px;line-height:1.35;color:var(--dim)}
.be .n{font-size:15px;font-weight:700;color:var(--ink)}.be .k{color:var(--gold);float:right;font-size:12px}
.be dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}.be dt{color:#ff8a7a;font-weight:700}.be dd{margin:0}
.be.lock{opacity:.5}
.rk{width:min(260px,100%);height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}.rk i{display:block;height:100%;background:linear-gradient(90deg,#7a0010,var(--gold))}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:8px}
.ac{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(30,4,8,.6)}
.ac .n{font-weight:700;color:var(--ink)}.ac .cost{color:var(--gold);font-size:12px;font-weight:700}.ac .d{grid-column:1/3;font-size:12px}.ac .rk{grid-column:1/3;width:100%}.ac.ok{border-color:var(--gold)}
.uc .cost{color:var(--gold);font-weight:700;font-size:13px}
.uc:disabled{opacity:.42;cursor:default}
.rr{padding:8px 22px;border-radius:10px;border:1px solid var(--line);background:rgba(40,6,10,.8);color:var(--gold);font-weight:700;font-size:14px}.rr:disabled{opacity:.4}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<canvas id="c"></canvas>
<div id="panel" class="glass">
 <div class="row"><span class="lb">VIDA</span><div class="bar hp"><i id="hpf"></i><em id="hpt"></em></div></div>

</div>

<div id="abil">
 <div class="ab cdv" data-a="atk"><svg viewBox="0 0 24 24"><path d="M20 4 9.5 14.5M20 4h-5M20 4v5M6.5 11.5l6 6M4 20l4-4"/></svg><kbd>J</kbd></div>

</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d'),TAU=Math.PI*2,R=Math.random;
const WW=2000,WH=900,GY=780,K=1.4,FLOOR=GY-44*K;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TOUCH=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window,MAXP=TOUCH?260:650,RATE=TOUCH?.6:1;
let W,H,DPR,S,VW,VH,CEIL=100,camX=0,camY=0,bg,vig,shake=0,flash=0,acc=0,boltT=0,hs=0;

// ---------- Sprites ----------
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c}
function radial(n,st){const c=mk(n,n),x=c.getContext('2d'),r=n/2,q=x.createRadialGradient(r,r,0,r,r,r);for(const[o,col]of st)q.addColorStop(o,col);x.fillStyle=q;x.fillRect(0,0,n,n);return c}
const glowOf=(r,v,b)=>radial(128,[[0,`rgba(${r},${v},${b},1)`],[.3,`rgba(${r*.8|0},${v*.5|0},${b*.6|0},.55)`],[.65,`rgba(${r*.4|0},${v*.2|0},${b*.3|0},.18)`],[1,'rgba(0,0,0,0)']]);
const hotOf=(r,v,b)=>radial(64,[[0,'rgba(255,250,245,1)'],[.25,`rgba(${r},${v},${b},.9)`],[.6,`rgba(${r*.7|0},${v*.4|0},${b*.5|0},.3)`],[1,'rgba(0,0,0,0)']]);
const GLOW=radial(128,[[0,'rgba(255,70,50,1)'],[.3,'rgba(230,20,30,.55)'],[.65,'rgba(120,0,15,.18)'],[1,'rgba(0,0,0,0)']]);
const HOT=radial(64,[[0,'rgba(255,245,230,1)'],[.25,'rgba(255,90,60,.9)'],[.6,'rgba(200,10,20,.3)'],[1,'rgba(0,0,0,0)']]);
const SMOKE=radial(128,[[0,'rgba(0,0,0,.95)'],[.45,'rgba(8,0,3,.65)'],[1,'rgba(0,0,0,0)']]);
const GLOWG=glowOf(255,210,90),HOTG=hotOf(255,210,80),GLOWI=glowOf(190,235,255);
// Colores por tipo de enemigo: espadachín, lancero, guardián, hechicero, asesino, bruto
const EH=[[170,110,255],[90,210,255],[170,200,235],[255,80,220],[120,255,170],[255,140,60]];
const EG=EH.map(c=>glowOf(...c)),EHT=EH.map(c=>hotOf(...c)),ECOL=EH.map(c=>`rgb(${c})`);
function feather(a,b,c2){const w=200,h=40,c=mk(w,h),x=c.getContext('2d'),q=x.createLinearGradient(6,0,w-6,0);
 q.addColorStop(0,a);q.addColorStop(.55,b);q.addColorStop(1,c2);x.shadowColor='#ff1a1a';x.shadowBlur=9;x.fillStyle=q;
 x.beginPath();x.moveTo(6,20);x.quadraticCurveTo(w*.45,5,w-8,20);x.quadraticCurveTo(w*.45,35,6,20);x.fill();
