<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Guerrero Carmesí</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
#hud{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));color:#f77;font-size:12px;opacity:.85;pointer-events:none;text-shadow:0 0 6px #f00}
#bar{position:fixed;left:max(12px,env(safe-area-inset-left));top:calc(max(8px,env(safe-area-inset-top)) + 20px);width:170px;height:7px;background:#2008;border:1px solid #a22;pointer-events:none}
#barf{height:100%;width:0;background:linear-gradient(90deg,#600,#f33,#fa8)}
#hp{position:fixed;left:max(12px,env(safe-area-inset-left));top:calc(max(8px,env(safe-area-inset-top)) + 32px);width:170px;height:7px;background:#2008;border:1px solid #a82;pointer-events:none}
#hpf{height:100%;width:100%;background:linear-gradient(90deg,#a60,#fc4,#ffe9a8)}
#stat{position:fixed;right:max(62px,calc(env(safe-area-inset-right) + 52px));top:calc(max(8px,env(safe-area-inset-top)) + 8px);color:#fbb;font-size:13px;text-shadow:0 0 8px #f00;pointer-events:none;white-space:nowrap;text-align:right;line-height:1.4}
#banner{position:fixed;left:0;right:0;top:20%;text-align:center;color:#ff6a5a;font-size:30px;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 0 18px #f00;opacity:0;transition:opacity .5s;pointer-events:none}
#cards{position:fixed;inset:0;z-index:6;display:none;flex-wrap:wrap;align-content:center;justify-content:center;gap:12px;padding:16px;background:#000b}
#cards button{width:min(270px,86vw);padding:12px 14px;border:2px solid #e33;border-radius:8px;background:#300d;color:#fcc;font-size:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
#cards b{font-size:17px;color:#ff8a6a}
#over{position:fixed;inset:0;z-index:5;display:none;overflow:auto;touch-action:pan-y;padding:10px;box-sizing:border-box;background:#000c;color:#f55;text-shadow:0 0 14px #f00}
#mm{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(660px,100%);margin:auto}
#mm .t{font-size:26px;letter-spacing:.12em;color:#ff6a5a;text-align:center;line-height:1.25}
#mm .t small{font-size:13px;letter-spacing:.04em;color:#fbb}
#mm .s{font-size:13px;color:#fbb;text-align:center}
#shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;width:100%}
#shop button{padding:8px 10px;border:1px solid #e33;border-radius:8px;background:#300d;color:#fcc;font-size:12px;text-align:left;display:flex;flex-direction:column;gap:2px;text-shadow:none}
#shop button:disabled{opacity:.4}
#shop b{font-size:13px;color:#ff8a6a}
#go{padding:12px 40px;border:2px solid #f55;border-radius:10px;background:#700;color:#fff;font-size:18px;letter-spacing:.1em}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid #c22a;display:none;pointer-events:none}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#e22b}
.b{position:fixed;width:84px;height:84px;touch-action:none;-webkit-appearance:none;border-radius:50%;border:2px solid #e33;background:#3008;color:#fcc;font-size:12px;display:none}
#atk{right:calc(max(20px,env(safe-area-inset-right)) + 6px);bottom:calc(max(24px,env(safe-area-inset-bottom)) + 8px);width:104px;height:104px;font-size:15px;background:#5008}
#dsh{right:calc(max(20px,env(safe-area-inset-right)) + 126px);bottom:calc(max(24px,env(safe-area-inset-bottom)) + 4px)}
#pow{right:calc(max(20px,env(safe-area-inset-right)) + 40px);bottom:calc(max(24px,env(safe-area-inset-bottom)) + 124px)}
#fea{right:calc(max(20px,env(safe-area-inset-right)) + 150px);bottom:calc(max(24px,env(safe-area-inset-bottom)) + 112px)}
#fs{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));width:40px;height:40px;border-radius:8px;border:1px solid #a22;background:#2008;color:#f88;font-size:20px;display:none}
#rot{position:fixed;inset:0;background:#000;color:#f55;display:none;align-items:center;justify-content:center;text-align:center;font-size:22px;z-index:9;padding:20px}

</style></head><body>
<canvas id="c"></canvas>
<div id="hud">WASD / flechas: volar · J o clic: espada · Espacio: embestida · Mantén K: poder · barra dorada = vida</div>
<div id="bar"><div id="barf"></div></div>
<button id="fs">⛶</button><div id="hp"><div id="hpf"></div></div><div id="stat"></div><div id="banner"></div><div id="over"></div><div id="cards"></div>
<div id="joy"><div id="knob"></div></div>
<button class="b" id="atk">Espada</button><button class="b" id="dsh">Dash</button><button class="b" id="pow">Poder</button><button class="b" id="fea">Plumas</button>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),TAU=Math.PI*2,R=Math.random;
const WW=2000,WH=900,GY=780,K=1.4,FLOOR=GY-44*K;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TOUCH=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window,MAXP=TOUCH?260:650,RATE=TOUCH?.6:1;
let W,H,DPR,S,VW,VH,CEIL=100,camY=0,bg,vig,camX=0,shake=0,flash=0,acc=0,boltT=0;

// ---------- Sprites pre-renderizados (una sola vez) ----------
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c}
function radial(n,st){const c=mk(n,n),x=c.getContext('2d'),r=n/2,q=x.createRadialGradient(r,r,0,r,r,r);for(const[o,col]of st)q.addColorStop(o,col);x.fillStyle=q;x.fillRect(0,0,n,n);return c}
const GLOW=radial(128,[[0,'rgba(255,70,50,1)'],[.3,'rgba(230,20,30,.55)'],[.65,'rgba(120,0,15,.18)'],[1,'rgba(0,0,0,0)']]);
const HOT=radial(64,[[0,'rgba(255,245,230,1)'],[.25,'rgba(255,90,60,.9)'],[.6,'rgba(200,10,20,.3)'],[1,'rgba(0,0,0,0)']]);
const GLOWV=radial(128,[[0,'rgba(190,110,255,1)'],[.3,'rgba(120,40,210,.55)'],[.65,'rgba(60,10,120,.18)'],[1,'rgba(0,0,0,0)']]);
const HOTV=radial(64,[[0,'rgba(250,240,255,1)'],[.25,'rgba(190,120,255,.9)'],[.6,'rgba(100,30,190,.3)'],[1,'rgba(0,0,0,0)']]);
const GLOWG=radial(128,[[0,'rgba(255,220,90,1)'],[.3,'rgba(230,160,20,.55)'],[.65,'rgba(120,70,0,.18)'],[1,'rgba(0,0,0,0)']]);
const HOTG=radial(64,[[0,'rgba(255,252,230,1)'],[.25,'rgba(255,210,80,.9)'],[.6,'rgba(200,130,10,.3)'],[1,'rgba(0,0,0,0)']]);
const GLOWI=radial(128,[[0,'rgba(190,235,255,1)'],[.3,'rgba(90,170,230,.55)'],[.65,'rgba(30,70,130,.18)'],[1,'rgba(0,0,0,0)']]);
const SMOKE=radial(128,[[0,'rgba(0,0,0,.95)'],[.45,'rgba(8,0,3,.65)'],[1,'rgba(0,0,0,0)']]);
function feather(a,b,c2){const w=200,h=40,c=mk(w,h),x=c.getContext('2d'),q=x.createLinearGradient(6,0,w-6,0);
 q.addColorStop(0,a);q.addColorStop(.55,b);q.addColorStop(1,c2);x.shadowColor='#ff1a1a';x.shadowBlur=9;x.fillStyle=q;
 x.beginPath();x.moveTo(6,20);x.quadraticCurveTo(w*.45,5,w-8,20);x.quadraticCurveTo(w*.45,35,6,20);x.fill();
 x.shadowBlur=0;x.strokeStyle='rgba(255,190,150,.45)';x.lineWidth=1.3;x.beginPath();x.moveTo(8,20);x.lineTo(w-26,20);x.stroke();return c}
const FBG=feather('#1a0c04','#6a4a10','#c8a020'),FFG=feather('#3a2406','#c89a20','#ffe28a');
const FBE=feather('#09050f','#2a1540','#46286a'),FFE=feather('#1a0c28','#4a2a72','#9a6ad0');
const FB=feather('#160205','#6e0912','#b5161f'),FF=feather('#40050b','#d81c27','#ff9064');

// ---------- Fondo (se rehace solo al cambiar tamaño) ----------
function buildBg(){
 const bw=W+Math.max(0,WW*S-W)*.25+4,c=mk(bw*DPR,H*DPR),x=c.getContext('2d');x.scale(DPR,DPR);
 let q=x.createLinearGradient(0,0,0,H);q.addColorStop(0,'#2a040b');q.addColorStop(.55,'#0e0206');q.addColorStop(1,'#040102');x.fillStyle=q;x.fillRect(0,0,bw,H);
 for(let i=0;i<170;i++){x.fillStyle=`rgba(255,${200+R()*55|0},${190+R()*60|0},${.2+R()*.6})`;const r=R()*1.6+.3;x.fillRect(R()*bw,R()*H*.6,r,r)}
 const mx=bw*.68,my=H*.24,mr=H*.11;
 x.globalCompositeOperation='lighter';x.drawImage(GLOW,mx-mr*4,my-mr*4,mr*8,mr*8);x.globalCompositeOperation='source-over';
 q=x.createRadialGradient(mx-mr*.3,my-mr*.3,mr*.1,mx,my,mr);q.addColorStop(0,'#ff6a4a');q.addColorStop(.7,'#b3121c');q.addColorStop(1,'#5a040c');
 x.fillStyle=q;x.beginPath();x.arc(mx,my,mr,0,TAU);x.fill();
 x.fillStyle='rgba(60,0,8,.35)';for(const[a,b,r]of[[.3,-.2,.18],[-.35,.25,.13],[.1,.4,.1]]){x.beginPath();x.arc(mx+a*mr,my+b*mr,r*mr,0,TAU);x.fill()}
 q=x.createLinearGradient(0,H*.5,0,H*.87);q.addColorStop(0,'rgba(140,10,20,0)');q.addColorStop(1,'rgba(140,10,20,.4)');x.fillStyle=q;x.fillRect(0,H*.5,bw,H*.4);
 for(const[col,base,amp,f]of[['#1a050a',.64,.17,.006],['#0c0306',.74,.13,.011]]){x.fillStyle=col;x.beginPath();x.moveTo(0,H);
  for(let i=0;i<=bw;i+=8)x.lineTo(i,H*base-H*amp*(.55+.45*Math.sin(i*f+base*20))*(.7+.3*Math.sin(i*f*2.7)));x.lineTo(bw,H);x.fill()}
 bg=c;
 vig=mk(W*DPR,H*DPR);const v=vig.getContext('2d'),vq=v.createRadialGradient(W*DPR/2,H*DPR/2,H*DPR*.35,W*DPR/2,H*DPR/2,Math.max(W,H)*DPR*.75);
 vq.addColorStop(0,'rgba(0,0,0,0)');vq.addColorStop(1,'rgba(0,0,0,.75)');v.fillStyle=vq;v.fillRect(0,0,W*DPR,H*DPR)}
function resize(){DPR=Math.min(TOUCH?1:1.5,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR|0;cv.height=H*DPR|0;if(H>W*1.05){VW=700;S=W/VW;VH=H/S}else{VH=clamp(H*1.45,480,900);S=H/VH;VW=W/S}CEIL=Math.min(100,WH-VH+140);buildBg()}
addEventListener('resize',resize);resize();

// ---------- Escenario ----------
const pil=[[180,250,1],[430,180,0],[1560,210,0],[1800,290,1]].map(([x,h,b])=>({x,h,b,j:Array.from({length:5},()=>R()*26)}));
const cracks=Array.from({length:9},(_,i)=>{let x=120+i*220+R()*80,y=GY+6;const pts=[[x,y]];for(let k=0;k<5;k++){x+=(R()-.5)*60;y+=8+R()*14;pts.push([x,y])}return pts});
const crystals=[[320,1],[690,.8],[1320,.9],[1690,1.15]];
const rocks=[[600,330,40],[1420,280,52],[1020,170,30]];
const ash=Array.from({length:70},()=>({x:R()*WW,y:R()*GY,v:15+R()*30,s:1+R()*2.2,p:R()*TAU}));
const groundG=g.createLinearGradient(0,GY,0,WH);groundG.addColorStop(0,'#1a080b');groundG.addColorStop(1,'#050203');
function world(t){
 g.globalCompositeOperation='lighter';g.globalAlpha=.3;
 for(const[x,y,r]of rocks)g.drawImage(GLOW,x-r*1.6,y+Math.sin(t*.8+x)*10+r*.1,r*3.2,r*1.8);
 g.globalAlpha=1;g.globalCompositeOperation='source-over';g.lineWidth=2;
 for(const[x,y0,r]of rocks){const y=y0+Math.sin(t*.8+x)*10;g.fillStyle='#14070a';g.strokeStyle='#3a0d14';
  g.beginPath();g.moveTo(x-r,y);g.lineTo(x-r*.5,y-r*.45);g.lineTo(x+r*.6,y-r*.4);g.lineTo(x+r,y);g.lineTo(x+r*.2,y+r*.9);g.closePath();g.fill();g.stroke()}
 for(const p of pil){const top=GY-p.h,w=46,l=p.x-w/2,r=p.x+w/2;g.fillStyle='#110608';g.strokeStyle='#2c0b11';
  g.beginPath();g.moveTo(l,GY);
  if(p.b){g.lineTo(l,top+p.j[0]);for(let i=1;i<=4;i++)g.lineTo(l+i*w/4,top+p.j[i])}
  else{g.lineTo(l,top+14);g.lineTo(l-9,top+14);g.lineTo(l-9,top);g.lineTo(r+9,top);g.lineTo(r+9,top+14);g.lineTo(r,top+14)}
  g.lineTo(r,GY);g.closePath();g.fill();g.stroke();
  g.strokeStyle='#1e080c';g.beginPath();for(const o of[-12,0,12]){g.moveTo(p.x+o,top+30);g.lineTo(p.x+o,GY-6)}g.stroke()}
 g.fillStyle=groundG;g.fillRect(-60,GY,WW+120,WH-GY+60);g.fillStyle='#2e0b11';g.fillRect(-60,GY,WW+120,3);
 g.fillStyle='#160709';g.strokeStyle='#3a0d14';
 for(const[w,y]of[[320,GY-16],[230,GY-32],[150,GY-48]]){g.fillRect(1000-w/2,y,w,16);g.strokeRect(1000-w/2,y,w,16)}
 for(const[x,s]of crystals){g.fillStyle='#5a0610';g.beginPath();g.moveTo(x-14*s,GY);g.lineTo(x-6*s,GY-46*s);g.lineTo(x,GY-70*s);g.lineTo(x+8*s,GY-40*s);g.lineTo(x+16*s,GY);g.fill();
  g.fillStyle='#b3141f';g.beginPath();g.moveTo(x-3*s,GY);g.lineTo(x,GY-62*s);g.lineTo(x+6*s,GY);g.fill()}
 g.globalCompositeOperation='lighter';
 const glow=.35+P.charge*.6;
 for(const[x,s]of crystals){g.globalAlpha=(.45+.2*Math.sin(t*2+x))*(1+P.charge);g.drawImage(GLOW,x-60*s,GY-110*s,120*s,140*s)}
 g.globalAlpha=1;g.lineWidth=2;
 cracks.forEach((c,i)=>{g.strokeStyle=`rgba(255,40,30,${clamp(glow+.2*Math.sin(t*2+i),0,1)})`;g.beginPath();g.moveTo(c[0][0],c[0][1]);for(const[x,y]of c)g.lineTo(x,y);g.stroke()});
 g.globalAlpha=.7+.3*Math.sin(t*3);g.drawImage(GLOW,940,GY-80,120,70);g.globalAlpha=1;
 g.globalCompositeOperation='source-over'}

// ---------- Guerrero ----------
const P={x:1000,y:GY-260,vx:0,vy:0,f:1,ph:0,t:0,atk:0,dash:0,cd:0,charge:0,hp:100,max:100,inv:0,fury:0,shield:0,furyCd:0,shieldCd:0,fcd:0,bt:0};
const ps=[],bolts=[],rings=[],slashes=[];
function power(){return 1+P.charge*1.3+(P.atk>0?.35:0)+(P.dash>0?.45:0)+(P.fury>0?.5:0)}
function wing(s,flap,spread,F1=FB,F2=FF){
 g.save();g.translate(s*6,-34);g.scale(s,1);
 for(let L=0;L<2;L++){const F=L?F2:F1;
  for(let i=0;i<8;i++){const len=(175-Math.abs(i-2)*15-L*58)*spread,ang=-1.35+i*.26+flap*.45+L*.06;
   g.save();g.rotate(ang);g.drawImage(F,0,-14,len,28);g.restore()}}
 g.restore()}
const PAL={cape:'#3a0409',armor:'#150a0e',armor2:'#1d0b10',trim:'#c4141e',belt:'#5a0a12',horn:'#2a0a10',eye:'#ff4a3a',guard:'#8a0f18',blade:'#ff3030',edge:'rgba(255,90,60,.9)',G:GLOW,H:HOT};
const PALB={cape:'#2a1004',armor:'#0b0806',armor2:'#1a120a',trim:'#e8b830',belt:'#503a08',horn:'#1a1006',eye:'#ffe28a',guard:'#8a6a10',blade:'#ffd24a',edge:'rgba(255,220,120,.9)',G:GLOWG,H:HOTG};
const PALE={cape:'#12081c',armor:'#0b0810',armor2:'#150d1f',trim:'#8a4fd0',belt:'#2a1440',horn:'#1a0d28',eye:'#d9b8ff',guard:'#4a2a7a',blade:'#b98bff',edge:'rgba(190,150,255,.9)',G:GLOWV,H:HOTV};
function body(o=P,pal=PAL){
 const lean=clamp(o.vx*o.f/700,-.4,.4),t=P.t+(o.ph||0)*.3,cw=Math.sin(t*4)*4;
 g.fillStyle=pal.cape;g.beginPath();g.moveTo(-10,-38);g.quadraticCurveTo(-30-lean*40,-5,-38-lean*60+cw,32);
 g.lineTo(-27-lean*40,26+cw*.5);g.lineTo(-20-lean*30,36);g.lineTo(-8,4);g.closePath();g.fill();
 g.lineCap='round';
 for(const o of[-5,5]){const k=Math.sin(o.ph*.5+o)*2;g.strokeStyle='#120609';g.lineWidth=9;
  g.beginPath();g.moveTo(o,0);g.lineTo(o-lean*20,22+k);g.lineTo(o-lean*30+2,40+k);g.stroke();
  g.strokeStyle=pal.trim;g.lineWidth=2;g.beginPath();g.moveTo(o-lean*20-4,22+k);g.lineTo(o-lean*20+4,22+k);g.stroke()}
 g.fillStyle=pal.armor;g.strokeStyle=pal.trim;g.lineWidth=2;
 g.beginPath();g.moveTo(-14,-40);g.lineTo(14,-40);g.lineTo(10,2);g.lineTo(-10,2);g.closePath();g.fill();g.stroke();
 g.fillStyle=pal.belt;g.fillRect(-11,-5,22,5);
 g.fillStyle=pal.armor2;
 for(const o of[-1,1]){g.beginPath();g.ellipse(o*15,-38,9,6,o*.3,0,TAU);g.fill();g.stroke();
  g.beginPath();g.moveTo(o*17,-42);g.lineTo(o*27,-52);g.lineTo(o*21,-37);g.closePath();g.fill()}
 g.fillStyle=pal.armor;g.beginPath();g.arc(0,-54,11,0,TAU);g.fill();g.stroke();
 g.fillStyle=pal.horn;
 for(const o of[-1,1]){g.beginPath();g.moveTo(o*7,-61);g.quadraticCurveTo(o*17,-74,o*10,-86);g.quadraticCurveTo(o*12,-71,o*2,-63);g.closePath();g.fill()}
 g.fillStyle=pal.eye;g.fillRect(3,-57,8,2.8);
 const sa=o.atk>0?-2.2+(1-o.atk/.32)*3.5:o.charge>0?-1.5:-.7+Math.sin(t*2.4)*.05;
 g.save();g.translate(12,-34);g.strokeStyle=pal.armor;g.lineWidth=8;g.beginPath();g.moveTo(0,0);g.lineTo(9,10);g.stroke();
 g.translate(9,10);g.rotate(sa);
 g.fillStyle='#2a1018';g.fillRect(-11,-2,15,4);g.fillStyle=pal.guard;g.fillRect(3,-9,4,18);
 g.fillStyle='#1f181c';g.strokeStyle=pal.blade;g.lineWidth=1.2;
 g.beginPath();g.moveTo(7,-4);g.lineTo(84,-2.5);g.lineTo(98,0);g.lineTo(84,2.5);g.lineTo(7,4);g.closePath();g.fill();g.stroke();
 g.globalCompositeOperation='lighter';g.globalAlpha=.5+o.charge*.5;g.drawImage(pal.G,-4,-12,108,24);g.globalAlpha=1;
 g.strokeStyle=pal.edge;g.lineWidth=1.5;g.beginPath();g.moveTo(14,0);g.lineTo(78,0);g.stroke();
 g.drawImage(pal.H,-17,-6,12,12);g.restore();
 g.drawImage(pal.H,-9,-31,18,18);g.drawImage(pal.H,0,-63,16,14);g.globalCompositeOperation='source-over'}
function warrior(){
 const bob=P.y<FLOOR-4?Math.sin(P.t*2.4)*4:0;
 g.save();g.translate(P.x,P.y+bob);g.scale(K,K);if(P.inv>0&&((P.t*18|0)&1))g.globalAlpha=.4;
 const flap=Math.sin(P.ph)*(1-P.charge*.6),sp=1+P.charge*.25;wing(-1,flap,sp);wing(1,flap,sp);
 g.scale(P.f,1);body();g.restore()}

// ---------- Aura, rayos y efectos ----------
function spawnAura(pw){
 const a=R(),x=P.x+(R()-.5)*55*K*pw,y=P.y+(R()-.25)*75*K;
 if(a<.38)ps.push({k:0,x,y,vx:(R()-.5)*30,vy:-(60+R()*90)*pw,l:1,d:.7+R()*.6,s:(45+R()*50)*pw});

 while(acc>1){acc--;if(ps.length<MAXP)spawnAura(pw)}

  p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k===2)p.vy+=320*dt}

 for(const a of[bolts,rings,slashes])for(let i=a.length-1;i>=0;i--){a[i].t+=dt;if(a[i].t>(a[i].d||(a===bolts?.14:.25)))a.splice(i,1)}
 shake*=Math.exp(-8*dt);flash=Math.max(0,flash-dt*2.5);
 for(const a of ash){a.y-=a.v*dt*(1+P.charge);a.x+=Math.sin(P.t+a.p)*12*dt;if(a.y<0){a.y=GY;a.x=R()*WW}}
 const tx=VW>WW?(WW-VW)/2:clamp(P.x-VW/2,0,WW-VW);camX+=(tx-camX)*Math.min(1,6*dt);const ty=clamp(P.y-VH*.62,Math.min(0,WH-VH),WH-VH);camY+=(ty-camY)*Math.min(1,6*dt);
 updateEnemies(dt);const bw=Math.round(P.charge*100);if(bw!==lastBar){lastBar=bw;barf.style.width=bw+'%'}}

 for(const s of slashes){const k=s.t/.25;g.save();g.translate(s.x,s.y);g.scale(s.f,1);
