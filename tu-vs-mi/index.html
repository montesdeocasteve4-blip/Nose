  // ---------- Campamento enemigo: tiendas, fogata y catapulta ----------
  const TENTS = [
    { type: 'tent', x: 3120, y: 1700, sy: 1722 },
    { type: 'tent', x: 3212, y: 1690, sy: 1712 },
    { type: 'tent', x: 3070, y: 1830, sy: 1852 }
  ];
  const CATA = { type: 'cata', x: 3180, y: 1960, sy: 1985, cd: 3, fire: 0 };
  const CATA_RANGE = 450; // alcance máximo de la catapulta, en px
  const CAMP_FIRE = { type: 'campfire', x: 3262, y: 2010, sy: 2020 };
  const BOULDERS = [];
  // Táctica enemiga: esperan en su campamento y atacan en grupo cuando tú te acercas
  // o pasan 20 s; eligen al soldado tuyo más herido y se retiran si quedan con poca vida
  const CAMP_HOLD = { x: 3250, y: 1860 };
  let enemyWave = false, enemyTimer = 0;
  // La catapulta dispara a tu soldado más cercano en CATA_RANGE px; la piedra cae con 30 de daño en 45 px
  function updateCamp(dt) {
    CATA.cd -= dt;
    CATA.fire = Math.max(0, CATA.fire - dt);
    if (CATA.cd <= 0) {
      let best = null, bd = CATA_RANGE;
      for (const p of units) {
        if (p.team !== 'player' || p.dead) continue;
        const d = Math.hypot(p.x - CATA.x, p.y - CATA.y);
        if (d < bd) { bd = d; best = p; }
      }
      if (best) {
        BOULDERS.push({ type: 'boulder', x0: CATA.x, y0: CATA.y, x: best.x, y: best.y, t: 0, dur: 1.1, struct: null });
        CATA.cd = 5; CATA.fire = 0.25;
      } else {
        // Sin soldados a tiro: la catapulta ataca tu economía (cocina si existe, si no el campo)
        const s = KITCHEN.built ? KITCHEN : FIELD;
        const tx = s === KITCHEN ? KITCHEN.x : FIELD.x + FIELD.w / 2;
        const ty = s === KITCHEN ? KITCHEN.y : FIELD.y + FIELD.h / 2;
        // Solo si el objetivo está dentro de su alcance
        if (Math.hypot(tx - CATA.x, ty - CATA.y) <= CATA_RANGE) {
          BOULDERS.push({ type: 'boulder', x0: CATA.x, y0: CATA.y, x: tx, y: ty, t: 0, dur: 1.1, struct: s });
          CATA.cd = 12; CATA.fire = 0.25;
        }
      }
    }
    for (let i = BOULDERS.length - 1; i >= 0; i--) {
      const b = BOULDERS[i];
      b.t += dt;
      if (b.t < b.dur) continue;
      for (const p of units) {
        if (p.team !== 'player' || p.dead) continue;
        if (Math.hypot(p.x - b.x, p.y - b.y) <= 45) {
          p.hp -= 30; p.flash = 0.2;
          addEffect(p.x, p.y - 50, '-30', '#ff6b6b');
          if (p.hp <= 0) { p.hp = 0; p.dead = true; p.target = null; }
        }
      }
      // La piedra que cae sobre el campo lo quema (vuelve a sembrar); sobre la cocina la destruye
      if (b.struct === FIELD) FIELD.t = 0;
      else if (b.struct === KITCHEN) KITCHEN.built = false;
      BOULDERS.splice(i, 1);
    }
  }
  function drawTent(t) {
    const { x, y } = t;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(x + 6, y + 10, 34, 10, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#d8c9a0';
    ctx.beginPath(); ctx.moveTo(x - 30, y + 10); ctx.lineTo(x, y - 34); ctx.lineTo(x + 30, y + 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#b5a47a';
    ctx.beginPath(); ctx.moveTo(x, y - 34); ctx.lineTo(x + 30, y + 10); ctx.lineTo(x, y + 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8c2a22';
    ctx.fillRect(x - 30, y + 4, 60, 4);
    ctx.fillStyle = '#4a3320';
    ctx.beginPath(); ctx.moveTo(x - 8, y + 10); ctx.lineTo(x, y - 6); ctx.lineTo(x + 8, y + 10); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#6b5a3a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x, y - 34); ctx.lineTo(x, y - 42); ctx.stroke();
    ctx.fillStyle = '#b8322b';
    ctx.beginPath(); ctx.moveTo(x, y - 42); ctx.lineTo(x + 8, y - 39); ctx.lineTo(x, y - 36); ctx.closePath(); ctx.fill();
  }
  function drawCata(c) {
    const ang = c.fire > 0 ? -1.0 + 1.6 * (1 - c.fire / 0.25) : -1.0;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(2, 12, 30, 9, 0, 0, TAU); ctx.fill();
    for (const wx of [-20, 20]) {
      ctx.fillStyle = '#3f2a16';
      ctx.beginPath(); ctx.arc(wx, 10, 9, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#8a6238'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(wx, 10, 5, 0, TAU); ctx.stroke();
    }
    ctx.fillStyle = '#6b4a2b';
    ctx.fillRect(-28, 0, 56, 8);
    ctx.fillRect(-24, -12, 6, 16);
    ctx.fillRect(18, -12, 6, 16);
    // brazo de lanzamiento con cuchara
    ctx.save();
    ctx.translate(0, -2);
    ctx.rotate(ang);
    ctx.fillStyle = '#8a6238'; ctx.fillRect(-4, -3, 46, 6);
    ctx.fillStyle = '#4a2f18';
    ctx.beginPath(); ctx.ellipse(42, 0, 6, 4, 0, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.restore();
  }
  function drawBoulder(b) {
    const p = Math.min(1, b.t / b.dur);
    const x = b.x0 + (b.x - b.x0) * p, y = b.y0 + (b.y - b.y0) * p;
    const lift = Math.sin(p * Math.PI) * 70;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(x, y + 2, 7, 3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#8a8a86';
    ctx.beginPath(); ctx.arc(x, y - lift, 7, 0, TAU); ctx.fill();
    ctx.fillStyle = '#b5b3ad';
    ctx.beginPath(); ctx.arc(x - 2, y - lift - 2, 2.5, 0, TAU); ctx.fill();
  }
  function drawCampFire(c, t) {
    const { x, y } = c;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(x, y + 4, 16, 6, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#5b3d24'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 9, y + 2); ctx.lineTo(x + 9, y - 2); ctx.moveTo(x + 9, y + 2); ctx.lineTo(x - 9, y - 2); ctx.stroke();
    const f1 = 1 + Math.sin(t * 10) * 0.12;
    ctx.fillStyle = '#ff7a1c';
    ctx.beginPath(); ctx.moveTo(x - 8, y - 1); ctx.quadraticCurveTo(x - 4, y - 20 * f1, x, y - 26 * f1);
    ctx.quadraticCurveTo(x + 5, y - 18 * f1, x + 8, y - 1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.moveTo(x - 4, y - 1); ctx.quadraticCurveTo(x - 2, y - 12, x, y - 14 * f1);
    ctx.quadraticCurveTo(x + 2, y - 10, x + 4, y - 1); ctx.closePath(); ctx.fill();
  }

  // ---------- Cocina, campo, granjero y comidas de tu escuadra ----------
  const FIELD = { type: 'field', x: 580, y: 1280, w: 200, h: 110, t: 0, sy: 1280 };
  const KITCHEN = { type: 'kitchen', x: 500, y: 1230, built: true, t: 0, sy: 1250 };
  const FOOD = { stock: 2 };
  const CROP_TIME = 50;
  let FARMER = null, fireFree = false;
  const counterPos = () => ({ x: KITCHEN.x + 34, y: KITCHEN.y + 26 });
  function resetEconomy() {
    FIELD.t = 0; FOOD.stock = 2; fireFree = false;
    KITCHEN.built = true; KITCHEN.t = 0;
    for (const s of SEATS) s.user = null;
    FARMER = makeUnit('civ', 'hoe', 540, 1300, 0, 'fogata');
    FARMER.task = 'idle'; FARMER.carry = 0;
  }
  // El campo madura en 50 s. La cocina destruida se reconstruye en 30 s
  function updateEconomy(dt) {
    FIELD.t = Math.min(CROP_TIME, FIELD.t + dt);
    if (!KITCHEN.built) {
      KITCHEN.t += dt;
      if (KITCHEN.t >= 30) { KITCHEN.built = true; KITCHEN.t = 0; }
    }
  }
  function cleanSeats() {
    for (const s of SEATS) if (s.user && (s.user.dead || !s.user.meal || s.user.meal.seat !== s)) s.user = null;
  }
  // Una guardia por entrada (índices de GATE_GUARD). Si cae un guardia, el soldado libre más cercano
  // lo releva, siempre que haya al menos 3 guerreros en pie
  const GUARD_IDX = [0, 2, 4];
  function assignPosts() {
    for (const p of player) {
      if (p.post >= 0 && (p.dead || p.ctrl || p.healer || p.homeMode !== 'base')) p.post = -1;
    }
    const alive = player.filter(p => !p.dead && !p.ctrl && !p.healer);
    if (alive.length < 3) return;
    for (let post = 0; post < GUARD_IDX.length; post++) {
      if (player.some(p => p.post === post && !p.dead)) continue;
      const g = GATE_GUARD[GUARD_IDX[post]];
      let best = null, bd = Infinity;
      for (const p of alive) {
        if (p.post >= 0 || p.homeMode !== 'base' || (p.meal && p.meal.state !== 'idle')) continue;
        const d = Math.hypot(p.x - g.x, p.y - g.y);
        if (d < bd) { bd = d; best = p; }
      }
      if (best) best.post = post;
    }
  }
  // Un guardia solo sale a comer si hay un relevo libre que ocupe su puesto
  function canLeavePost(u) {
    if (u.homeMode !== 'base' || u.post < 0) return true;
    return player.some(q => q !== u && !q.dead && !q.ctrl && !q.healer && q.homeMode === 'base' && q.post < 0 && !(q.meal && q.meal.state !== 'idle'));
  }
  function releaseMeal(u, returning) {
    const m = u.meal;
    if (m.seat && m.seat.user === u) m.seat.user = null;
    m.seat = null;
    m.timer = 45 + rand() * 45;
    m.state = returning ? 'returning' : 'idle';
    m.t = 0;
  }
  // Se mueve hacia p; devuelve true cuando llega
  function walkStep(u, p, sp) {
    const dx = p.x - u.x, dy = p.y - u.y, d = Math.hypot(dx, dy);
    if (d < 8) { u.vx = 0; u.vy = 0; return true; }
    const q = navPoint(u, p), qx = q.x - u.x, qy = q.y - u.y, qd = Math.hypot(qx, qy) || 1;
    u.vx = qx / qd * sp; u.vy = qy / qd * sp;
    return false;
  }
  // Hambre: la barra baja sola. A 0 empieza la segunda ronda: busca comida, -10% velocidad, daño y vida
  // máxima, y pierde 3 de vida por segundo hasta comer
  function eatMeal(u) { u.hunger = 100; u.starving = false; u.hungry = false; FOOD.stock--; }
  function hungerUpdate(u, dt) {
    const eating = !!(u.meal && u.meal.state === 'eating') || (u.eatT || 0) > 0;
    if (u.eatT > 0) { u.eatT -= dt; if (u.eatT <= 0) { u.eatT = 0; u.hunger = 100; u.starving = false; } }
    if (!eating) u.hunger = Math.max(0, u.hunger - dt * 100 / 120);
    if (u.hunger <= 0 && !u.starving) { u.starving = true; addEffect(u.x, u.y - 60, '¡Hambre!', '#ff9a6a'); }
    if (u.starving && !eating) {
      u.hp = Math.min(u.hp, 90) - 3 * dt;
      if (u.hp <= 0) { u.hp = 0; u.dead = true; u.target = null; }
    }
    // Controlado a mano: come al llegar a la cocina
    const cp = counterPos();
    if (u.ctrl && u.starving && FOOD.stock > 0 && Math.hypot(u.x - cp.x, u.y - cp.y) < 50) eatMeal(u);
  }
  // Comida: va a la cocina cuando tiene hambre, toma su plato, se sienta en la fogata 5-9 s y regresa a su puesto
  function mealUpdate(u, dt) {
    if (!u.meal) u.meal = { state: 'idle', timer: 30 + rand() * 50, seat: null, t: 0, dur: 6 };
    const m = u.meal;
    if (u.ctrl || alert.active) { if (m.state !== 'idle') releaseMeal(u, false); return false; }
    const sp = WEAPONS[u.weapon].speed * 0.7;
    if (m.state === 'idle') {
      // Solo sale a comer si tiene hambre, no hay enemigos cerca y puede dejar su puesto
      if (!u.starving || !canLeavePost(u) || nearestEnemyDist(u) < 220) return false;
      m.state = 'toKitchen';
      u.post = -1; // libera su puesto para el relevo
    }
    if (m.state === 'toKitchen') {
      if (!walkStep(u, counterPos(), sp)) return true;
      const seat = SEATS.find(s => !s.user);
      if (!seat) { releaseMeal(u, true); return true; } // sin sitio libre: vuelve a su puesto en vez de quedarse parado
      if (FOOD.stock <= 0) { u.hungry = true; return true; } // espera en la cocina a que haya comida
      eatMeal(u);
      seat.user = u; m.seat = seat; m.state = 'toSeat';
      return true;
    }
    if (m.state === 'toSeat') {
      if (walkStep(u, m.seat, sp)) { m.state = 'eating'; m.t = 0; m.dur = 5 + rand() * 4; }
      return true;
    }
    if (m.state === 'eating') {
      m.t += dt; u.vx = 0; u.vy = 0;
      u.f = Math.atan2(FIRE.y - u.y, FIRE.x - u.x);
      if (m.t >= m.dur) releaseMeal(u, true);
      return true;
    }
    // volviendo a su puesto
    if (walkStep(u, homePos(u), sp)) { m.state = 'idle'; return false; }
    return true;
  }
  // El granjero cosecha el campo cuando madura y lleva la cosecha a la cocina (1 cosecha = 3 comidas)
  function farmThink(u, dt) {
    const sp = WEAPONS.hoe.speed;
    const field = { x: FIELD.x + FIELD.w / 2, y: FIELD.y + FIELD.h / 2 };
    u.task = u.task || 'idle';
    if (u.task === 'idle') {
      if (walkStep(u, counterPos(), sp) && FIELD.t >= CROP_TIME) u.task = 'toField';
      return;
    }
    if (u.task === 'toField') {
      if (walkStep(u, field, sp)) { u.task = 'work'; u.workT = 0; }
      return;
    }
    if (u.task === 'work') {
      u.vx = 0; u.vy = 0; u.workT += dt;
      u.f = Math.atan2(field.y - u.y, field.x - u.x);
      if (u.workT >= 4) { FIELD.t = 0; u.carry = 3; u.task = 'toKitchen'; }
      return;
    }
    if (u.task === 'toKitchen') {
      if (walkStep(u, counterPos(), sp)) {
        FOOD.stock = Math.min(10, FOOD.stock + u.carry);
        addEffect(KITCHEN.x, KITCHEN.y - 50, '+' + u.carry + ' comida', '#ffd966');
        u.carry = 0; u.task = 'idle';
      }
    }
  }
  function drawField(f) {
    const ripe = f.t >= CROP_TIME, g = Math.min(1, f.t / CROP_TIME);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(f.x + 5, f.y + 6, f.w, f.h);
    ctx.fillStyle = '#4a3018';
    ctx.fillRect(f.x, f.y, f.w, f.h);
    for (let row = 0; row < 5; row++) {
      const y0 = f.y + 16 + row * 21;
      ctx.fillStyle = '#3a2410'; ctx.fillRect(f.x + 3, y0 + 4, f.w - 6, 4);
      ctx.fillStyle = '#5e4226'; ctx.fillRect(f.x + 3, y0 + 8, f.w - 6, 2);
      for (let col = 0; col < 10; col++) {
        const x = f.x + 10 + col * 19, h = 2 + g * 13;
        ctx.strokeStyle = ripe ? '#c9a33a' : (g > 0.5 ? '#4f8a34' : '#6aa44a');
        ctx.lineWidth = 1.8; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x, y0 + 6); ctx.lineTo(x, y0 + 6 - h); ctx.stroke();
        if (g > 0.25) {
          ctx.fillStyle = ripe ? '#d6b04a' : '#5e9e3e';
          ctx.beginPath(); ctx.ellipse(x - 3, y0 + 6 - h * 0.5, 3, 1.4, -0.5, 0, TAU); ctx.fill();
          ctx.beginPath(); ctx.ellipse(x + 3, y0 + 6 - h * 0.7, 3, 1.4, 0.5, 0, TAU); ctx.fill();
        }
        if (ripe) { ctx.fillStyle = '#f0d060'; ctx.beginPath(); ctx.ellipse(x, y0 - 2, 2, 3.5, 0, 0, TAU); ctx.fill(); }
      }
    }
    ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 2;
    ctx.strokeRect(f.x + 0.5, f.y + 0.5, f.w - 1, f.h - 1);
    for (let x = f.x; x <= f.x + f.w; x += 25) { ctx.fillStyle = '#7a5230'; ctx.fillRect(x - 2, f.y - 3, 4, 6); }
    if (!ripe) {
      ctx.fillStyle = '#ffd9a0'; ctx.font = 'bold 10px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('Creciendo ' + Math.ceil(CROP_TIME - f.t) + ' s', f.x + f.w / 2, f.y - 8);
      ctx.textAlign = 'left';
    }
  }
  function drawKitchen(k, t) {
    const x = k.x, y = k.y;
    if (!k.built) {
      ctx.fillStyle = '#6b5a3a';
      ctx.beginPath(); ctx.ellipse(x, y + 4, 26, 10, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#8a7a52';
      ctx.fillRect(x - 12, y - 2, 8, 6); ctx.fillRect(x + 4, y + 2, 9, 5);
      return;
    }
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x - 26, y - 2, 56, 24);
    // paredes de adobe con hiladas
    ctx.fillStyle = '#b08a5a'; ctx.fillRect(x - 28, y - 22, 56, 26);
    ctx.strokeStyle = '#7a5a34'; ctx.lineWidth = 1;
    for (let r = -18; r < 2; r += 6) { ctx.beginPath(); ctx.moveTo(x - 28, y + r); ctx.lineTo(x + 28, y + r); ctx.stroke(); }
    // puerta
    ctx.fillStyle = '#4a2f18'; ctx.fillRect(x - 6, y - 10, 12, 14);
    // techo de tejas a dos aguas
    ctx.fillStyle = '#8c3a2a';
    ctx.beginPath(); ctx.moveTo(x - 34, y - 20); ctx.lineTo(x, y - 42); ctx.lineTo(x + 34, y - 20); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#5e2418'; ctx.lineWidth = 1;
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(x + i * 8, y - 20); ctx.lineTo(x + i * 3, y - 40); ctx.stroke(); }
    // chimenea con humo
    ctx.fillStyle = '#6b4a2b'; ctx.fillRect(x + 16, y - 48, 7, 16);
    for (let i = 0; i < 3; i++) {
      const sy = y - 52 - ((t * 18 + i * 8) % 26);
      ctx.fillStyle = 'rgba(210,210,210,' + (0.5 - i * 0.12) + ')';
      ctx.beginPath(); ctx.arc(x + 19 + Math.sin(t + i) * 3, sy, 3 + i, 0, TAU); ctx.fill();
    }
    // estufa con fuego y olla
    ctx.fillStyle = '#3a3a3a'; ctx.fillRect(x - 22, y - 14, 14, 10);
    ctx.fillStyle = 'rgba(255,' + Math.round(120 + Math.sin(t * 12) * 30) + ',40,0.9)';
    ctx.fillRect(x - 20, y - 10, 10, 4);
    ctx.fillStyle = '#1e1e1e'; ctx.beginPath(); ctx.ellipse(x - 15, y - 16, 6, 3, 0, 0, TAU); ctx.fill();
    // mesa frente a la cocina con sacos de grano y platos
    ctx.fillStyle = '#6b4a2b'; ctx.fillRect(x + 4, y + 6, 26, 6);
    ctx.fillStyle = '#e0c070';
    ctx.beginPath(); ctx.ellipse(x + 9, y + 4, 4.5, 3.5, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 20, y + 4, 4.5, 3.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#d9d2c0'; ctx.beginPath(); ctx.ellipse(x + 26, y + 9, 3, 1.4, 0, 0, TAU); ctx.fill();
  }
  
  function drawHay(x, y, s) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(x + 2, y + 4, 12 * s, 4 * s, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e0b84a';
    ctx.beginPath(); ctx.ellipse(x, y, 12 * s, 8 * s, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#a57d25'; ctx.lineWidth = 1;
    for (let i = -4; i <= 4; i++) {
      ctx.beginPath(); ctx.moveTo(x + i * 2.4 * s, y - 6 * s); ctx.lineTo(x + i * 2.4 * s + 2, y + 6 * s); ctx.stroke();
    }
    ctx.strokeStyle = '#7a5a1a'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(x, y, 12 * s, 8 * s, 0, 0, TAU); ctx.stroke();
  }

  function drawStable(s) {
    const { x, y, w, h } = s;
    // sombra
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(x + 6, y + 10, w + 10, h + 6);
    // paja en el suelo del establo
    ctx.fillStyle = '#d9b050';
    ctx.fillRect(x + 4, y + 36, w - 8, 20);
    ctx.strokeStyle = '#a57d25'; ctx.lineWidth = 1;
    for (let i = 0; i < 16; i++) {
      const sx = x + 8 + (i * 9) % (w - 16);
      ctx.beginPath(); ctx.moveTo(sx, y + 38 + (i % 3) * 5); ctx.lineTo(sx + 5, y + 40 + (i % 3) * 5); ctx.stroke();
    }
    // paredes de tablones
    ctx.fillStyle = '#6e4a2a';
    ctx.fillRect(x, y + 6, w, h - 6);
    ctx.fillStyle = '#4a2f18';
    for (let i = x + 8; i < x + w; i += 13) ctx.fillRect(i, y + 8, 1.6, h - 10);
    ctx.fillRect(x, y + 6, w, 2);
    // postes de esquina
    ctx.fillStyle = '#4a2f18';
    ctx.fillRect(x - 3, y + 4, 7, h);
    ctx.fillRect(x + w - 4, y + 4, 7, h);
    // farol
    ctx.fillStyle = 'rgba(255,200,90,0.35)';
    ctx.beginPath(); ctx.arc(x + 4, y + 20, 9, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffd966';
    ctx.beginPath(); ctx.arc(x + 4, y + 20, 3, 0, TAU); ctx.fill();
    // techo de paja a dos aguas
    ctx.fillStyle = '#c9a24a';
    ctx.beginPath();
    ctx.moveTo(x - 14, y + 8); ctx.lineTo(x + w / 2, y - 20); ctx.lineTo(x + w + 14, y + 8); ctx.closePath(); ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = '#8c6a2a'; ctx.lineWidth = 1.2;
    for (let i = -20; i < w + 30; i += 6) {
      ctx.beginPath(); ctx.moveTo(x + i, y + 10); ctx.lineTo(x + i + 7, y - 24); ctx.stroke();
    }
    ctx.restore();
    // cumbrera y alero oscuro
    ctx.strokeStyle = '#6e4f1c'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x + w / 2, y - 20); ctx.lineTo(x + w / 2, y - 22); ctx.stroke();
    ctx.fillStyle = '#9a7430';
    ctx.fillRect(x - 14, y + 4, w + 28, 5);
    // heno apilado a un lado
    drawHay(x + w + 22, y + 52, 1);
    drawHay(x + w + 34, y + 60, 0.85);
    drawHay(x - 20, y + 56, 0.9);
    // letrero
    ctx.fillStyle = '#ffd966';
    ctx.font = 'bold 10px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ESTABLO', x + w / 2, y - 26);
    ctx.textAlign = 'left';
  }

  function drawPit(p) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(p.x + 3, p.y + 4, p.r + 4, p.r * 0.6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1a1208';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#3f2a16'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke();
    // estacas afiladas apuntando hacia afuera
    ctx.fillStyle = '#8a6238';
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * TAU, bx = p.x + Math.cos(a) * p.r * 0.92, by = p.y + Math.sin(a) * p.r * 0.92;
      ctx.beginPath();
      ctx.moveTo(bx + Math.cos(a + 1.3) * 4, by + Math.sin(a + 1.3) * 4);
      ctx.lineTo(bx + Math.cos(a) * 11, by + Math.sin(a) * 11);
      ctx.lineTo(bx + Math.cos(a - 1.3) * 4, by + Math.sin(a - 1.3) * 4);
      ctx.closePath(); ctx.fill();
    }
  }

  function nearestPlayerDist(u) {
    let best = Infinity;
    for (const p of units) if (p.team === 'player' && !p.dead) best = Math.min(best, Math.hypot(p.x - u.x, p.y - u.y));
    return best;
  }
  function enemyThink(u, dt) {
    const aliveE = enemy.filter(e => !e.dead).length;
    enemyTimer += dt;
    // Hambriento y sin combate cerca: va a su fogata y come
    if (u.starving && nearestPlayerDist(u) > 260) {
      if (u.eatT > 0) { u.vx = 0; u.vy = 0; return; }
      const cd = Math.hypot(CAMP_FIRE.x - u.x, CAMP_FIRE.y - u.y);
      if (cd > 30) {
        const p = navPoint(u, CAMP_FIRE), px = p.x - u.x, py = p.y - u.y, pd = Math.hypot(px, py) || 1;
        u.vx = px / pd * 70; u.vy = py / pd * 70;
      } else { u.eatT = 5; u.vx = 0; u.vy = 0; }
      return;
    }
    if (!enemyWave) {
      const pc = units.some(p => p.team === 'player' && !p.dead && Math.hypot(p.x - CAMP_HOLD.x, p.y - CAMP_HOLD.y) < 700);
      if (pc || enemyTimer > 20) { enemyWave = true; enemyTimer = 0; }
    } else if (aliveE <= 1) {
      enemyWave = false; enemyTimer = 0;
    }
    // Con poca vida se retiran al campamento
    if (enemyWave && u.hp < 25) {
      const dx = CAMP_HOLD.x - u.x, dy = CAMP_HOLD.y - u.y, d = Math.hypot(dx, dy) || 1;
      u.vx = dx / d * 60; u.vy = dy / d * 60;
      return;
    }
    if (!enemyWave) {
      // Esperan formados en el campamento; si tu escuadra llega, responden
      if (nearestPlayerDist(u) < 260) { think(u, dt); return; }
      const idx = Math.max(0, enemy.indexOf(u));
      const hx = CAMP_HOLD.x + (idx - 2) * 40, hy = CAMP_HOLD.y;
      const dx = hx - u.x, dy = hy - u.y, d = Math.hypot(dx, dy);
      if (d > 6) { u.vx = dx / d * 60; u.vy = dy / d * 60; }
      return;
    }
    think(u, dt);
  }

  function updateUnits(dt) {
    updateAlert(dt);
    assignPosts();
    updateHorse();
    updateDummies(dt);
    updateCamp(dt);
    updateEconomy(dt);
    cleanSeats();
    const mx = cam.x + (mouse.x - W / 2) / zoom;
    const my = cam.y + (mouse.y - H / 2) / zoom;

    for (const u of units) {
      if (u.dead) continue;
      u.cd = Math.max(0, u.cd - dt);
      u.fireT = Math.max(0, (u.fireT || 0) - dt);
      u.flash = Math.max(0, u.flash - dt);
      u.blockT = Math.max(0, u.blockT - dt);
      if (u.team !== 'civ') { hungerUpdate(u, dt); if (u.dead) continue; }

      if (u.swing > 0) {
        u.swing -= dt;
        if (!u.hitDone && u.swing <= u.swingTotal * 0.5) { u.hitDone = true; resolveHit(u); }
        if (u.swing < 0) u.swing = 0;
      }

      u.vx = 0; u.vy = 0;
      if (u.ctrl) {
        // Bloqueo: dura hasta 1 s y solo se puede volver a activar 2 s después de empezar
        const wantBlock = (rmb || touchBlock) && u.shield;
        u.blockCd = Math.max(0, (u.blockCd || 0) - dt);
        u.blockDur = Math.max(0, (u.blockDur || 0) - dt);
        if (wantBlock && !u.blocking && u.blockCd <= 0) { u.blocking = true; u.blockDur = 1; u.blockCd = 2; }
        if (u.blocking && (!wantBlock || u.blockDur <= 0)) u.blocking = false;
        if (!touchMode && u.swing <= 0) u.f = Math.atan2(my - u.y, mx - u.x);
        let dx = 0, dy = 0;
        if (keys.has('a') || keys.has('arrowleft')) dx -= 1;
        if (keys.has('d') || keys.has('arrowright')) dx += 1;
        if (keys.has('w') || keys.has('arrowup')) dy -= 1;
        if (keys.has('s') || keys.has('arrowdown')) dy += 1;
        let mag = 1;
        if (dx || dy) { const l = Math.hypot(dx, dy); dx /= l; dy /= l; }
        const jm = Math.hypot(joy.x, joy.y);
        if (jm > 0.12) { dx = joy.x / jm; dy = joy.y / jm; mag = Math.min(1, jm); }
        if (touchMode && jm > 0.2 && u.swing <= 0) u.f = Math.atan2(joy.y, joy.x);
        if (dx || dy) {
          const sp = WEAPONS[u.weapon].speed * (u.blocking ? 0.4 : 1) * mag * (u.mounted ? 1.8 : 1);
          u.vx = dx * sp; u.vy = dy * sp;
        }
      } else {
        u.blocking = u.blockT > 0;
        if (u.healer) healerThink(u, dt);
        else if (u.team === 'player' && u.mode !== 'attack') { if (!mealUpdate(u, dt)) guardThink(u, dt); }
        else if (u.team === 'enemy') enemyThink(u, dt);
        else if (u.team === 'civ') farmThink(u, dt);
        else think(u, dt);
      }

      let k = 1;
      if (u.swing > 0) k = 0.3;
      if (u.blocking) k = Math.min(k, 0.4);
      if (u.starving) k *= 0.9; // hambriento: 10% más lento
      for (const p of PITS) {
        if (Math.hypot(u.x - p.x, u.y - p.y) < p.r) {
          k = Math.min(k, 0.35);
          if (u.mounted) {
            dismount(u);
            u.hp -= 10; u.flash = 0.2;
            addEffect(u.x, u.y - 60, 'CAÍDA -10', '#ff6b6b');
            if (u.hp <= 0) { u.hp = 0; u.dead = true; u.target = null; }
          }
          break;
        }
      }
      u.x = clamp(u.x + u.vx * k * dt, X0 + 30, WORLD_W - 30);
      u.y = clamp(u.y + u.vy * k * dt, Y0 + 30, WORLD_H - 30);
      for (const w of SOLIDS) pushOutOfWall(u, w);
      if (u.vx || u.vy) u.walkT += dt * 9;
    }

    // Separación: nadie atraviesa a otro
    for (let i = 0; i < units.length; i++) {
      for (let j = i + 1; j < units.length; j++) {
        const a = units[i], b = units[j];
        if (a.dead || b.dead || a.team === b.team) continue; // los del mismo bando no chocan
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy), min = 28;
        if (d < min) {
          const nx = d < 0.01 ? 1 : dx / d, ny = d < 0.01 ? 0 : dy / d;
          const push = (min - d) / 2;
          a.x -= nx * push; a.y -= ny * push;
          b.x += nx * push; b.y += ny * push;
        }
      }
    }
  }

  // ---------- Ataque, arco y flechas ----------
  function nearestEnemyDist(u) {
    let best = Infinity;
    for (const e of units) if (e.team !== u.team && e.team !== 'civ' && !e.dead) best = Math.min(best, Math.hypot(e.x - u.x, e.y - u.y));
    return best;
  }

  function fireArrow(u, spread) {
    const R = WEAPONS.bow.ranged;
    u.cd = WEAPONS.bow.cd;
    u.fireT = 0.25;
    const a = u.f + (rand() * 2 - 1) * spread;
    arrows.push({ x: u.x, y: u.y, sx: u.x, sy: u.y, vx: Math.cos(a) * R.speed, vy: Math.sin(a) * R.speed,
                  team: u.team, range: R.range, dmg: R.dmg * (u.starving ? 0.9 : 1) });
  }

  // Ataque manual o de la IA: el arco dispara, o usa la espada corta si el enemigo está pegado
  function doAttack(u) {
    if (u.cd > 0 || u.swing > 0) return;
    if (u.weapon === 'bow') {
      if (nearestEnemyDist(u) <= 40) startSwing(u);
      else {
        const e = nearestEnemy(u);
        if (e && Math.hypot(e.x - u.x, e.y - u.y) <= WEAPONS.bow.ranged.range) u.f = Math.atan2(e.y - u.y, e.x - u.x);
        fireArrow(u, 0.02);
      }
      return;
    }
    startSwing(u);
  }

  function applyArrowHit(a, e) {
    const toShooter = Math.atan2(a.sy - e.y, a.sx - e.x);
    const facing = Math.abs(angDiff(toShooter, e.f)) < 1.6;
    let dmg = a.dmg;
    if (e.mounted) dmg *= 0.7; // a caballo recibes 30% menos daño
    if (e.blocking && e.shield && facing) {
      // Solo el escudo visible al frente bloquea: la mitad del daño
      dmg *= 0.5;
      addEffect(e.x, e.y - 50, 'ESCUDO -' + Math.round(dmg), '#7fd3ff');
    } else {
      addEffect(e.x, e.y - 50, '-' + Math.round(dmg), '#ff6b6b');
    }
    e.hp -= dmg;
    e.flash = 0.2;
    if (e.hp <= 0) { e.hp = 0; e.dead = true; e.blocking = false; e.target = null; }
  }

  function updateArrows(dt) {
    for (let i = arrows.length - 1; i >= 0; i--) {
      const a = arrows[i];
      a.x += a.vx * dt; a.y += a.vy * dt;
      let hit = false;
      for (const e of [...units, ...DUMMIES]) {
        if (e.team === a.team || e.team === 'civ' || e.dead) continue;
        if (Math.hypot(e.x - a.x, e.y - a.y) <= 14) { applyArrowHit(a, e); hit = true; break; }
      }
      const far = Math.hypot(a.x - a.sx, a.y - a.sy) > a.range;
      const inWall = SOLIDS.some(w => a.x >= w.x && a.x <= w.x + w.w && a.y >= w.y && a.y <= w.y + w.h);
      if (hit || far || inWall || a.x < X0 || a.y < Y0 || a.x > WORLD_W || a.y > WORLD_H) arrows.splice(i, 1);
    }
  }

  function drawArrows() {
    ctx.lineWidth = 1.6;
    for (const a of arrows) {
      const ang = Math.atan2(a.vy, a.vx);
      ctx.strokeStyle = '#d8d2c0';
      ctx.beginPath(); ctx.moveTo(a.x - Math.cos(ang) * 12, a.y - Math.sin(ang) * 12); ctx.lineTo(a.x, a.y); ctx.stroke();
      ctx.fillStyle = '#9aa3ad';
      ctx.beginPath(); ctx.arc(a.x, a.y, 1.8, 0, TAU); ctx.fill();
    }
  }

  function healNearFire(dt) {
    for (const u of player) {
      if (u.dead || u.hp >= 100) continue;
      if (Math.hypot(u.x - FIRE.x, u.y - FIRE.y) <= HEAL_R) u.hp = Math.min(100, u.hp + HEAL_RATE * dt);
    }
  }

  // Curandero: cada 2 s cura 20 de vida al aliado herido más bajo que esté a 120 px
  function healerPulse(dt) {
    for (const h of player) {
      if (!h.healer || h.dead) continue;
      h.healCd = Math.max(0, (h.healCd || 0) - dt);
      if (h.healCd > 0) continue;
      let best = null;
      for (const p of player) {
        if (p.dead || p.hp >= 100) continue;
        if (Math.hypot(p.x - h.x, p.y - h.y) > 120) continue;
        if (!best || p.hp < best.hp) best = p;
      }
      if (best) {
        best.hp = Math.min(100, best.hp + 20); h.healCd = 2;
        addEffect(best.x, best.y - 50, '+20', '#6ccf4f');
      }
    }
  }

  // Casa del curandero: rápida con el curandero dentro, muy lenta sin él
  function inHouse(u) {
    return u.x >= HOUSE.x && u.x <= HOUSE.x + HOUSE.w && u.y >= HOUSE.y && u.y <= HOUSE.y + HOUSE.h;
  }
  function houseHeal(dt) {
    const healerIn = player.some(h => h.healer && !h.dead && inHouse(h));
    for (const p of player) {
      if (p.dead || p.hp >= 100 || !inHouse(p)) continue;
      p.hp = Math.min(100, p.hp + (healerIn ? 25 : 1.5) * dt);
    }
  }

  function checkEnd() {
    if (control.dead) {
      const alive = player.find(p => !p.dead);
      if (alive) setControl(alive);
    }
    if (!ended) {
      if (enemy.every(e => e.dead)) ended = 'win';
      else if (player.every(p => p.dead)) ended = 'lose';
      if (ended) {
        over.innerHTML = (ended === 'win' ? '¡Victoria!' : 'Derrota') + '<small>Clic para jugar otra vez</small>';
        over.style.display = 'flex';
      }
    }
  }

  // ---------- Dibujo de la barricada (estacas y tablones apilados) ----------
  function drawWall(w) {
    const horiz = w.w >= w.h;
    const L = horiz ? w.w : w.h, T = horiz ? w.h : w.w;
    let s = (Math.floor(w.x * 13.7 + w.y * 7.3 + w.w) >>> 0) || 1;
    const r = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    ctx.save();
    if (horiz) ctx.translate(w.x, w.y);
    else { ctx.translate(w.x + w.w, w.y); ctx.rotate(Math.PI / 2); }
    // sombra y tierra removida al pie
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fillRect(3, 7, L, T);
    ctx.fillStyle = 'rgba(70,52,30,0.55)';
    for (let x = 0; x < L; x += 14 + r() * 10) {
      ctx.beginPath(); ctx.ellipse(x, T + 3, 6 + r() * 5, 2.5, 0, 0, TAU); ctx.fill();
    }
    // estacas afiladas (algunas rotas)
    for (let x = 5; x < L; x += 16 + r() * 14) {
      const h = (r() < 0.2 ? 5 : 11) + r() * 13, lean = (r() - 0.5) * 9, bw = 3.5 + r() * 2;
      ctx.fillStyle = '#4a2f18';
      ctx.beginPath(); ctx.moveTo(x - bw, 4); ctx.lineTo(x + lean, -h); ctx.lineTo(x + bw, 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#9a7242';
      ctx.beginPath(); ctx.moveTo(x - bw * 0.4, 0); ctx.lineTo(x + lean * 0.85, -h + 2); ctx.lineTo(x + bw * 0.1, 0); ctx.closePath(); ctx.fill();
    }
    // tablones verticales de distinto ancho, con vetas, nudos y alguna mancha
    const shades = ['#7b5331', '#8c6439', '#6a4826', '#5a3c22'];
    for (let x = 0; x < L;) {
      const pw = 10 + r() * 10, top = r() * T * 0.12, bot = T - r() * T * 0.12;
      if (r() < 0.06) { ctx.fillStyle = '#120b05'; ctx.fillRect(x, 0, pw, T); }
      else {
        ctx.fillStyle = shades[Math.floor(r() * shades.length)];
        ctx.fillRect(x, top, pw, bot - top);
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(x + pw - 2, top, 2, bot - top);
        ctx.strokeStyle = 'rgba(255,220,160,0.16)'; ctx.lineWidth = 1;
        for (let k = 0; k < 2; k++) {
          const gx = x + pw * (0.25 + k * 0.4);
          ctx.beginPath(); ctx.moveTo(gx, top + 2); ctx.lineTo(gx + (r() - 0.5), bot - 2); ctx.stroke();
        }
        if (r() < 0.35) {
          ctx.fillStyle = '#2a1a0c';
          ctx.beginPath(); ctx.ellipse(x + pw / 2, top + (bot - top) * (0.3 + r() * 0.4), 1.8, 2.6, 0, 0, TAU); ctx.fill();
        }
        if (r() < 0.12) {
          ctx.fillStyle = 'rgba(95,12,12,0.55)';
          ctx.beginPath(); ctx.ellipse(x + pw / 2, top + (bot - top) * 0.7, 3 + r() * 3, 4 + r() * 4, 0, 0, TAU); ctx.fill();
        }
        ctx.strokeStyle = '#2a1a0c'; ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, top + 0.5, pw - 1, bot - top - 1);
      }
      x += pw;
    }
    // travesaños con cuerda y clavos
    for (const ry of [T * 0.2, T * 0.64]) {
      ctx.fillStyle = '#44301a'; ctx.fillRect(0, ry, L, 5);
      ctx.strokeStyle = '#c9b18a'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 0; x < L; x += 8) { ctx.moveTo(x, ry + 1); ctx.lineTo(x + 4, ry + 4); }
      ctx.stroke();
      ctx.fillStyle = '#1a100a';
      for (let x = 8; x < L; x += 40) { ctx.beginPath(); ctx.arc(x, ry + 2.5, 1.4, 0, TAU); ctx.fill(); }
    }
    ctx.restore();
  }

  // ---------- Dibujo del estante de armas ----------
  function drawRack(r) {
    const { x, y } = r;
    if (canUseRack()) {
      ctx.strokeStyle = 'rgba(255,217,102,0.6)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(x, y, 50, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(x, y + 3, 30, 9, 0, 0, TAU); ctx.fill();
    // postes y travesaño
    ctx.fillStyle = '#6b4a2b';
    ctx.fillRect(x - 28, y - 52, 5, 52); ctx.fillRect(x + 23, y - 52, 5, 52);
    ctx.fillStyle = '#8a6238';
    ctx.fillRect(x - 30, y - 50, 60, 5);
    // espada colgada
    ctx.fillStyle = '#dfe6ee'; ctx.fillRect(x - 20, y - 44, 2.5, 30);
    ctx.fillStyle = '#c9a227'; ctx.fillRect(x - 23, y - 15, 8, 3);
    // hacha colgada
    ctx.fillStyle = '#7a5230'; ctx.fillRect(x - 8, y - 44, 2, 30);
    ctx.fillStyle = '#b9c2cc';
    ctx.beginPath(); ctx.moveTo(x - 8, y - 44); ctx.lineTo(x - 1, y - 40); ctx.lineTo(x - 1, y - 30); ctx.lineTo(x - 8, y - 26); ctx.closePath(); ctx.fill();
    // lanza apoyada
    ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 6, y - 2); ctx.lineTo(x + 14, y - 50); ctx.stroke();
    ctx.fillStyle = '#cfd6de';
    ctx.beginPath(); ctx.moveTo(x + 12, y - 48); ctx.lineTo(x + 14, y - 58); ctx.lineTo(x + 17, y - 48); ctx.closePath(); ctx.fill();
    // arco colgado
    ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + 15, y - 42); ctx.quadraticCurveTo(x + 22, y - 28, x + 15, y - 14); ctx.stroke();
  }

  // ---------- Dibujo de la casa del curandero: refugio de paja, barro y hierbas ----------
  function drawHouse(h, t) {
    const { x, y, w, h: hh } = h;
    // zona de curación: suelo de hierbas
    ctx.fillStyle = 'rgba(110,220,140,0.16)'; ctx.fillRect(x - 6, y - 4, w + 12, hh + 8);
    ctx.fillStyle = '#5e4a2c'; ctx.fillRect(x - 6, y + 40, w + 12, hh - 36);
    for (let i = 0; i < 28; i++) {
      const hx = x - 2 + (i * 37) % (w + 4), hy = y + 46 + (i * 53) % (hh - 44);
      ctx.fillStyle = i % 5 === 0 ? '#b07ad6' : i % 3 === 0 ? '#f0f0e0' : '#4f8a34';
      ctx.beginPath(); ctx.arc(hx, hy, 2.2, 0, TAU); ctx.fill();
    }
    // pared de barro con entramado de ramas
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(x + 4, y + 16, w + 4, 6);
    ctx.fillStyle = '#d8c49a'; ctx.fillRect(x, y + 14, w, 30);
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 1.5;
    for (let i = -10; i < w + 20; i += 10) { ctx.beginPath(); ctx.moveTo(x + i, y + 14); ctx.lineTo(x + i + 14, y + 44); ctx.stroke(); }
    // postes de madera
    ctx.fillStyle = '#6b4a2b';
    ctx.fillRect(x - 3, y + 12, 6, hh - 14); ctx.fillRect(x + w - 3, y + 12, 6, hh - 14);
    // viga con manojos de hierbas colgando
    ctx.fillStyle = '#5b3d24'; ctx.fillRect(x + 4, y + 10, w - 8, 4);
    for (const bx of [x + 18, x + 36, x + w - 36, x + w - 18]) {
      ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(bx, y + 14); ctx.lineTo(bx, y + 22); ctx.stroke();
      ctx.fillStyle = '#4f8a34'; ctx.beginPath(); ctx.ellipse(bx, y + 27, 4, 7, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#6aa44a'; ctx.beginPath(); ctx.ellipse(bx - 2, y + 25, 1.8, 4, -0.4, 0, TAU); ctx.fill();
    }
    // techo de paja a dos aguas con borde oscuro
    ctx.fillStyle = '#c9a24a';
    ctx.beginPath(); ctx.moveTo(x - 14, y + 16); ctx.lineTo(x + w / 2, y - 18); ctx.lineTo(x + w + 14, y + 16); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a88230'; ctx.fillRect(x - 14, y + 12, w + 28, 5);
    ctx.strokeStyle = '#8c6a2a'; ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(x + 10 + i * 18, y + 12); ctx.lineTo(x + w / 2, y - 16); ctx.stroke(); }
    // mesa con mortero, tarros, frascos y hierbas
    ctx.fillStyle = '#7a5230'; ctx.fillRect(x + 14, y + hh - 22, w - 28, 6);
    ctx.fillStyle = '#4a2f18'; ctx.fillRect(x + 16, y + hh - 16, 3, 16); ctx.fillRect(x + w - 19, y + hh - 16, 3, 16);
    ctx.fillStyle = '#8a8a86'; ctx.beginPath(); ctx.ellipse(x + 26, y + hh - 26, 7, 3.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a5a56'; ctx.fillRect(x + 30, y + hh - 36, 2.5, 11);
    ctx.fillStyle = '#b5673a'; ctx.beginPath(); ctx.ellipse(x + 52, y + hh - 27, 5, 6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7fc8a9'; ctx.fillRect(x + 62, y + hh - 33, 4, 12); ctx.fillRect(x + 68, y + hh - 31, 4, 10);
    ctx.fillStyle = '#4f8a34'; ctx.beginPath(); ctx.ellipse(x + w - 26, y + hh - 27, 6, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#6aa44a'; ctx.beginPath(); ctx.ellipse(x + w - 33, y + hh - 28, 4, 3, 0, 0, TAU); ctx.fill();
    // letrero
    ctx.fillStyle = '#ffd966'; ctx.font = 'bold 9px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('CURANDERO', x + w / 2, y + hh + 10);
    ctx.textAlign = 'left';
  }

  // ---------- Dibujo de la fogata ----------
  function drawFire(f, t) {
    const { x, y } = f;
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * TAU + 0.2;
      ctx.fillStyle = i % 2 ? '#7d7a72' : '#6a675f';
      ctx.beginPath(); ctx.ellipse(x + Math.cos(a) * 24, y + Math.sin(a) * 15 + 2, 5, 3.5, 0, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,200,90,0.35)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.arc(x, y, HEAL_R, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,170,60,0.12)';
    ctx.beginPath(); ctx.arc(x, y - 8, 60, 0, TAU); ctx.fill();
    ctx.fillStyle = '#3b2a1a';
    ctx.beginPath(); ctx.ellipse(x, y + 2, 14, 6, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 10, y + 1); ctx.lineTo(x + 10, y - 3); ctx.moveTo(x + 10, y + 1); ctx.lineTo(x - 10, y - 3); ctx.stroke();
    const f1 = 1 + Math.sin(t * 9) * 0.12, f2 = 1 + Math.sin(t * 13 + 1) * 0.1;
    ctx.fillStyle = '#ff9f1c';
    ctx.beginPath(); ctx.moveTo(x - 9, y - 2); ctx.quadraticCurveTo(x - 6, y - 24 * f1, x, y - 30 * f1);
    ctx.quadraticCurveTo(x + 6, y - 22 * f2, x + 9, y - 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.moveTo(x - 5, y - 2); ctx.quadraticCurveTo(x - 3, y - 14 * f2, x, y - 18 * f2);
    ctx.quadraticCurveTo(x + 3, y - 12 * f1, x + 5, y - 2); ctx.closePath(); ctx.fill();
  }

  // ---------- Dibujo de unidades ----------
  function drawShield(x, y, front, team) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#6b4a2b';
    ctx.beginPath(); ctx.ellipse(0, 0, 6, 9, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#c8c8c8'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = team === 'enemy' ? '#a8322b' : '#2f6fb0';
    ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawWeapon(u, bob) {
    const w = WEAPONS[u.weapon];
    let a = w.a0 + (u.mounted && u.weapon !== 'spear' ? -0.5 : 0), ext = 0;
    if (u.mounted && u.weapon === 'spear') a = 0.02;
    if (u.swing > 0) {
      const p = 1 - u.swing / u.swingTotal;
      if (u.weapon === 'spear') ext = Math.sin(p * Math.PI) * (u.mounted ? 22 : 14);
      else a = w.a0 + (u.mounted ? -1.6 + 3.1 * p : -0.9 + 2.2 * p);
    }
    ctx.save();
    ctx.translate(10, -22 + bob);
    ctx.rotate(a);
    // Con el arco en reposo se ve el arco; mientras golpea, la espada corta
    const kind = (u.weapon === 'bow' && u.swing > 0) ? 'sword' : u.weapon;
    if (kind === 'sword') {
      ctx.fillStyle = '#5b3d24'; ctx.fillRect(-6, -1, 6, 2);
      ctx.fillStyle = '#c9a227'; ctx.fillRect(0, -4, 2, 8);
      ctx.fillStyle = '#dfe6ee';
      ctx.beginPath(); ctx.moveTo(2, -1.6); ctx.lineTo(26, -1.2); ctx.lineTo(30, 0); ctx.lineTo(26, 1.2); ctx.lineTo(2, 1.6); ctx.fill();
    } else if (u.weapon === 'greatsword') {
      ctx.fillStyle = '#5b3d24'; ctx.fillRect(-9, -1.2, 9, 2.4);
      ctx.fillStyle = '#c9a227'; ctx.fillRect(0, -5, 2.5, 10);
      ctx.fillStyle = '#dfe6ee';
      ctx.beginPath(); ctx.moveTo(2.5, -2); ctx.lineTo(36, -1.5); ctx.lineTo(41, 0); ctx.lineTo(36, 1.5); ctx.lineTo(2.5, 2); ctx.fill();
    } else if (u.weapon === 'spear') {
      ctx.fillStyle = '#7a5230'; ctx.fillRect(-14, -1, 74 + ext, 2);
      ctx.fillStyle = '#cfd6de';
      ctx.beginPath(); ctx.moveTo(60 + ext, -3); ctx.lineTo(72 + ext, 0); ctx.lineTo(60 + ext, 3); ctx.fill();
    } else if (kind === 'knife') {
      ctx.fillStyle = '#5b3d24'; ctx.fillRect(-4, -1, 5, 2.5);
      ctx.fillStyle = '#dfe6ee';
      ctx.beginPath(); ctx.moveTo(1, -1.5); ctx.lineTo(16, -1); ctx.lineTo(18, 0); ctx.lineTo(16, 1); ctx.lineTo(1, 1.5); ctx.fill();
    } else if (kind === 'hoe') {
      ctx.fillStyle = '#7a5230'; ctx.fillRect(-12, -1, 34, 2);
      ctx.fillStyle = '#9aa3ad';
      ctx.beginPath(); ctx.moveTo(20, -1); ctx.lineTo(28, -6); ctx.lineTo(29, -2); ctx.lineTo(22, 2); ctx.closePath(); ctx.fill();
    } else if (kind === 'bow') {
      const pull = u.fireT > 0 ? -2 : 3;
      ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(3, -11); ctx.quadraticCurveTo(9, 0, 3, 11); ctx.stroke();
      ctx.strokeStyle = '#e8e0c8'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(3, -11); ctx.lineTo(pull, 0); ctx.lineTo(3, 11); ctx.stroke();
    } else if (u.weapon === 'axe') {
      ctx.fillStyle = '#7a5230'; ctx.fillRect(-10, -1.2, 30, 2.4);
      ctx.fillStyle = '#b9c2cc';
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(18, -8); ctx.lineTo(24, -7); ctx.lineTo(23, 0); ctx.lineTo(24, 7); ctx.lineTo(18, 8); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawUnit(u, t) {
    const isEnemy = u.team === 'enemy';
    const tunic = u.flash > 0 ? '#f0e0a0' : u.healer ? '#e9efe0' : (u.team === 'civ' ? '#8a6a3a' : isEnemy ? '#a8322b' : '#2f6fb0');
    const helmet = u.healer ? '#3f9e5a' : u.team === 'civ' ? '#d9b050' : isEnemy ? '#5a5f66' : '#9aa3ad';
    if (u.mounted && !u.dead) drawHorseAt(u.x, u.y, u.f, t, !!(u.vx || u.vy));
    ctx.save();
    ctx.translate(u.x, u.y);

    if (u.dead) {
      ctx.fillStyle = 'rgba(120,20,20,0.45)';
      ctx.beginPath(); ctx.ellipse(0, 2, 16, 7, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = isEnemy ? '#7d2620' : '#22507f';
      ctx.fillRect(-12, -3, 18, 6);
      ctx.fillStyle = '#e0b48a';
      ctx.beginPath(); ctx.arc(-14, 0, 4.5, 0, TAU); ctx.fill();
      ctx.restore();
      return;
    }

    const flip = Math.cos(u.f) < 0 ? -1 : 1;
    ctx.scale(1.3 * flip, 1.3);
    if (u.mounted) ctx.translate(0, -14);
    const moving = u.vx || u.vy;
    const bob = moving ? 0 : Math.sin(t * 2 + u.x) * 0.5;
    const st = moving ? Math.sin(u.walkT) * 2 : 0;

    if (!u.mounted) {
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.ellipse(0, 1, 11, 4.5, 0, 0, TAU); ctx.fill();
    }

    // piernas
    ctx.fillStyle = '#4a3a2a';
    if (!u.mounted) {
      ctx.fillRect(-5 + st, -14, 4.5, 14);
      ctx.fillRect(0.5 - st, -14, 4.5, 14);
    }

    // brazo trasero
    ctx.strokeStyle = tunic; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-4, -30 + bob); ctx.lineTo(-6, -20 + bob); ctx.stroke();

    // torso
    ctx.fillStyle = tunic;
    ctx.fillRect(-7, -33 + bob, 14, 20);
    ctx.fillStyle = '#3b2817';
    ctx.fillRect(-7, -18 + bob, 14, 2.5);
    if (u.healer) { // cruz roja del curandero
      ctx.fillStyle = '#d6453d';
      ctx.fillRect(-1, -29 + bob, 2, 7); ctx.fillRect(-3.5, -27.5 + bob, 7, 2);
    }

    // cabeza y casco
    ctx.fillStyle = '#e0b48a';
    ctx.beginPath(); ctx.arc(0, -38 + bob, 5.5, 0, TAU); ctx.fill();
    ctx.fillStyle = helmet;
    ctx.beginPath(); ctx.arc(0, -40 + bob, 6.2, Math.PI, 0); ctx.fill();
    ctx.fillRect(-6.2, -40 + bob, 12.4, 2);
    ctx.fillStyle = isEnemy ? '#a8322b' : '#2f6fb0';
    ctx.fillRect(-0.8, -47 + bob, 1.6, 4);

    // escudo en la espalda (si no bloquea)
    if (u.shield && !u.blocking) drawShield(-7, -22 + bob, false, u.team);

    // brazo del arma
    ctx.strokeStyle = tunic;
    ctx.beginPath(); ctx.moveTo(5, -30 + bob); ctx.lineTo(10, -22 + bob); ctx.stroke();
    drawWeapon(u, bob);

    // escudo al frente (si bloquea)
    if (u.shield && u.blocking) drawShield(u.mounted ? 16 : 14, (u.mounted ? -30 : -24) + bob, true, u.team);

    ctx.fillStyle = '#e0b48a';
    ctx.beginPath(); ctx.arc(10, -22 + bob, 2, 0, TAU); ctx.fill();
    ctx.restore();

    // indicadores de comida
    if (u.meal && u.meal.state === 'eating' || u.hungry) {
      ctx.fillStyle = u.hungry && !(u.meal && u.meal.state === 'eating') ? '#ff9a6a' : '#ffd9a0';
      ctx.font = 'bold 10px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(u.meal && u.meal.state === 'eating' ? 'comiendo' : 'hambre', u.x, u.y + 16);
      ctx.textAlign = 'left';
    }
    // barra de vida y marcador del soldado controlado
    // barra de vida: siempre visible
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(u.x - 15, u.y - 62, 30, 5);
    ctx.fillStyle = u.hp > 50 ? '#6ccf4f' : '#e74c3c';
    ctx.fillRect(u.x - 15, u.y - 62, 30 * u.hp / 100, 5);
    if (u.team !== 'civ') { // barra de hambre: fina, bajo la de vida; amarilla, morada si está hambriento
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(u.x - 15, u.y - 55, 30, 2);
      ctx.fillStyle = u.starving ? '#9b59b6' : '#f2c14e';
      ctx.fillRect(u.x - 15, u.y - 55, 30 * u.hunger / 100, 2);
    }
    if (u.ctrl) {
      ctx.fillStyle = '#ffd966';
      ctx.beginPath();
      ctx.moveTo(u.x, u.y - 72); ctx.lineTo(u.x - 5, u.y - 80); ctx.lineTo(u.x + 5, u.y - 80);
      ctx.closePath(); ctx.fill();
    }
  }

  // ---------- Cámara ----------
  function clampCamera() {
    const hw = Math.min(W / 2 / zoom, VW / 2);
    const hh = Math.min(H / 2 / zoom, VH / 2);
    cam.x = clamp(cam.x, X0 + hw, WORLD_W - hw);
    cam.y = clamp(cam.y, Y0 + hh, WORLD_H - hh);
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    clampCamera();
  }
  window.addEventListener('resize', resize);

  // ---------- Controles ----------
  window.addEventListener('keydown', e => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab'].includes(e.key)) e.preventDefault();
    const k = e.key.toLowerCase();
    keys.add(k);
    if (ended) return;
    if (/^[1-5]$/.test(k)) equip(RACK[Number(k) - 1]);
    else if (k === 'g') toggleRack();
    else if (k === 'm') toggleMount();
    else if (k === 'e') orderAttack();
    else if (k === 'r') orderDefend();
    else if (k === 'b') orderBase();
    else if (k === 'tab') cycleControl();
  });
  window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  window.addEventListener('blur', () => { keys.clear(); rmb = false; });

  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    touchMode = false; mouse.x = e.clientX; mouse.y = e.clientY;
  });
  canvas.addEventListener('pointerdown', e => {
    // Tocar el estante físico (estando cerca) abre el menú de armas
    const wx = cam.x + (e.clientX - W / 2) / zoom, wy = cam.y + (e.clientY - H / 2) / zoom;
    if (!rackOpen && Math.hypot(wx - RACK_POS.x, wy - RACK_POS.y) < 40) { toggleRack(); return; }
    if (e.pointerType === 'touch') return; // en teléfono se ataca con el botón Atacar
    touchMode = false;
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (e.button === 0 && !ended && control && !control.dead) {
      doAttack(control);
    } else if (e.button === 2) {
      rmb = true;
    }
  });
  window.addEventListener('pointerup', e => { if (e.button === 2) rmb = false; });
  over.addEventListener('click', reset);

  // ---------- Órdenes compartidas (teclado y botones) ----------
  // Órdenes de escuadra: recuerdan el modo base; durante una alarma se aplican al terminarla
  function setOrder(m) {
    for (const p of squadGroup()) {
      // Cualquier orden corta la comida en curso: nadie se queda sentado o esperando en la cocina
      if (p.meal && p.meal.state !== 'idle') releaseMeal(p, true);
      p.hungry = false;
      p.homeMode = m;
      if (!alert.active || alert.phase === 'engage') p.mode = m;
    }
  }
  function orderAttack() { setOrder('attack'); }
  function orderDefend() { setOrder('fogata'); }
  function orderBase() { setOrder('base'); }
  function cycleControl() {
    const alive = player.filter(p => !p.dead);
    if (alive.length) setControl(alive[(alive.indexOf(control) + 1) % alive.length]);
  }

  // ---------- Estante de armas ----------
  const RACK = ['sword', 'spear', 'axe', 'greatsword', 'bow'];
  const rack = document.getElementById('rack');
  let rackOpen = false;
  function buildRack() {
    rack.innerHTML = '<div class="rk-head"><b>Estante de armas</b><button data-rk="close">Cerrar</button></div>' +
      RACK.map((k, i) => {
        const w = WEAPONS[k];
        const info = k === 'bow' ? 'Dispara a distancia' : `Alcance ${w.reach} · Daño ${w.dmg}`;
        const on = control && control.weapon === k ? ' on' : '';
        return `<button class="rk-item${on}" data-rk="${k}">` +
               `<span class="rk-n">${i + 1}</span><span class="rk-name">${w.name}${w.shield ? ' + escudo' : ''}</span>` +
               `<small>${info}</small></button>`;
      }).join('');
  }
  function openRack() { buildRack(); rack.hidden = false; rackOpen = true; }
  function closeRack() { rack.hidden = true; rackOpen = false; }
  // El estante es físico: solo se usa estando cerca de él
  function canUseRack() {
    return !!control && !control.dead && Math.hypot(control.x - RACK_POS.x, control.y - RACK_POS.y) <= 50;
  }
  // Se abre sola al pararte junto al estante y se cierra al alejarte; "Cerrar" la oculta hasta que te alejes
  let rackDismissed = false;
  function syncRack() {
    if (!canUseRack()) { rackDismissed = false; if (rackOpen) closeRack(); return; }
    if (!rackOpen && !rackDismissed) openRack();
  }
  function toggleRack() {
    if (!canUseRack()) {
      if (control && !control.dead) addEffect(control.x, control.y - 60, 'Ve al estante', '#ffd966');
      return;
    }
    if (rackOpen) { rackDismissed = true; closeRack(); } else { rackDismissed = false; openRack(); }
  }

  // Órdenes de escuadra con un solo botón
  function homeOrder() { const g = squadGroup()[0]; return g ? g.homeMode : 'fogata'; }
  function toggleSquad() { if (homeOrder() === 'attack') orderDefend(); else orderAttack(); setSquadLabel(); }
  function setSquadLabel() {
    const b = document.querySelector('#ring .b-squad');
    if (b) b.textContent = homeOrder() === 'attack' ? 'Esc.: ataque' : 'Esc.: fogata';
  }
  rack.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.rk === 'close') { rackDismissed = true; closeRack(); }
    else equip(b.dataset.rk);
  });
  // Cambiar de arma tarda 0.8 s (desenvainar)
  function equip(w) {
    if (ended) return;
    if (!canUseRack()) {
      if (control && !control.dead) addEffect(control.x, control.y - 60, 'Ve al estante', '#ffd966');
      return;
    }
    if (control.healer) { addEffect(control.x, control.y - 60, 'Curandero: solo cuchillo', '#ffd966'); return; }
    const u = control;
    u.weapon = w; u.shield = WEAPONS[w].shield;
    u.swing = 0; u.hitDone = false; u.cd = 0.8;
    u.blocking = false; u.blockT = 0;
    if (rackOpen) buildRack();
    addEffect(u.x, u.y - 60, 'Cambiado: ' + WEAPONS[w].name, '#ffd966');
  }

  // ---------- Controles táctiles (teléfono) ----------
  const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  if (isTouch) document.body.classList.add('touch');
  const joyZone = document.getElementById('joyzone');
  const joyEl = document.getElementById('joy'), knob = document.getElementById('knob');
  const JOY_R = 70;
  const ZOOMS = [0.8, 1.2, 0.6];
  let zoomIdx = 0;
  let joyCx = 0, joyCy = 0;

  // Joystick flotante: aparece donde pones el dedo en la mitad izquierda de la pantalla
  function joyMove(e) {
    const dx = e.clientX - joyCx, dy = e.clientY - joyCy;
    const d = Math.hypot(dx, dy), m = Math.min(d, JOY_R);
    const nx = d > 0 ? dx / d : 0, ny = d > 0 ? dy / d : 0;
    const k = m / JOY_R;
    // zona muerta de 15% para no moverse por accidente
    const mag = k < 0.15 ? 0 : Math.min(1, (k - 0.15) / 0.85);
    joy.x = nx * mag; joy.y = ny * mag;
    knob.style.transform = `translate(${nx * m}px, ${ny * m}px)`;
  }
  joyZone.addEventListener('pointerdown', e => {
    e.preventDefault();
    touchMode = true; joy.id = e.pointerId;
    joyCx = e.clientX; joyCy = e.clientY;
    joyEl.style.left = joyCx + 'px'; joyEl.style.top = joyCy + 'px';
    knob.style.transform = '';
    joy.x = 0; joy.y = 0;
    joyEl.hidden = false;
    joyZone.setPointerCapture(e.pointerId);
  });
  joyZone.addEventListener('pointermove', e => { if (e.pointerId === joy.id) joyMove(e); });
  const joyEnd = e => {
    if (e.pointerId !== joy.id) return;
    joy.id = null; joy.x = 0; joy.y = 0; joyEl.hidden = true;
  };
  joyZone.addEventListener('pointerup', joyEnd);
  joyZone.addEventListener('pointercancel', joyEnd);

  document.querySelectorAll('#touch button').forEach(btn => {
    const act = btn.dataset.act;
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      touchMode = true;
      if (act === 'block') { touchBlock = true; return; }
      if (ended) return;
      if (act === 'attack') {
        if (control && !control.dead) doAttack(control);
      } else if (act === 'squad') toggleSquad();
      else if (act === 'base') orderBase();
      else if (act === 'mount') toggleMount();
      else if (act === 'rack') toggleRack();
      else if (act === 'zoom') { zoomIdx = (zoomIdx + 1) % ZOOMS.length; zoom = ZOOMS[zoomIdx]; clampCamera(); }
    });
    const up = () => { if (act === 'block') touchBlock = false; };
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('pointerleave', up);
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    zoom = clamp(zoom * (e.deltaY > 0 ? 0.9 : 1.1), 0.5, 2);
    clampCamera();
  }, { passive: false });

  // ---------- Render ----------
  function render(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#1d2b14';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom,
                     dpr * (W / 2 - cam.x * zoom), dpr * (H / 2 - cam.y * zoom));
    ctx.drawImage(ground, X0, Y0);

    const m = 80 / zoom;
    const left = cam.x - W / 2 / zoom - m, right = cam.x + W / 2 / zoom + m;
    const top = cam.y - H / 2 / zoom - m, bottom = cam.y + H / 2 / zoom + m;
    const items = [];
    for (const d of decor) if (d.x >= left && d.x <= right && d.y >= top && d.y <= bottom) items.push(d);
    for (const u of units) if (u.x >= left && u.x <= right && u.y >= top && u.y <= bottom) items.push(u);
    for (const w of WALLS) items.push(w);
    items.push(STABLE);
    for (const s of SEATS) items.push(s);
    for (const d of DUMMIES) items.push(d);
    items.push(...TENTS, CATA, CAMP_FIRE);
    items.push(FIELD, KITCHEN, HOUSE);
    for (const b of BOULDERS) items.push(b);
    for (const p of PITS) items.push(p);
    if (!horse.rider) items.push(horse);
    items.sort((a, b) => (a.sy ?? a.y) - (b.sy ?? b.y));
    for (const it of items) {
      if (it.type === 'tree') drawTree(it);
      else if (it.type === 'bush') drawBush(it);
      else if (it.type === 'fire') drawFire(it, t);
      else if (it.type === 'rack') drawRack(it);
      else if (it.type === 'wall') drawWall(it);
      else if (it.type === 'stable') drawStable(it);
      else if (it.type === 'pit') drawPit(it);
      else if (it.type === 'seat') drawSeat(it);
      else if (it.type === 'dummy') drawDummy(it);
      else if (it.type === 'tent') drawTent(it);
      else if (it.type === 'cata') drawCata(it);
      else if (it.type === 'campfire') drawCampFire(it, t);
      else if (it.type === 'boulder') drawBoulder(it);
      else if (it.type === 'field') drawField(it);
      else if (it.type === 'kitchen') drawKitchen(it, t);
      else if (it.type === 'house') drawHouse(it, t);
      else if (it.type === 'horse') drawHorseAt(it.x, it.y, it.f, t, it.moving);
      else drawUnit(it, t);
    }

    drawArrows();

    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    for (const e of effects) {
      ctx.globalAlpha = Math.max(0, 1 - e.t / 0.9);
      ctx.fillStyle = e.color;
      ctx.fillText(e.text, e.x, e.y - e.t * 30);
    }
    ctx.globalAlpha = 1;
  }

  function updateHud() {
    setSquadLabel();
    const rb = document.querySelector('#ring .b-rack');
    if (rb) rb.hidden = !canUseRack();
    const mb = document.querySelector('#ring .b-mount');
    if (mb) {
      const show = !!control && !control.dead && (control.mounted || nearHorse());
      mb.hidden = !show;
      mb.textContent = control && control.mounted ? 'Bajar' : 'Montar';
    }
    const pa = player.filter(p => !p.dead).length;
    const ea = enemy.filter(e => !e.dead).length;
    hud.innerHTML =
      `<b>Controlas:</b> ${WEAPONS[control.weapon].name} · vida ${Math.ceil(control.hp)}` +
      `${control.blocking ? ' · <b>bloqueando</b>' : ''}<br>` +
      `Tu escuadra (azul): ${pa}/${player.length} · Ejército de Claude (rojo): ${ea} · Comida: ${FOOD.stock}<br>` +
      `<span class="keyhelp">WASD mover · Mouse apuntar · Clic izq. atacar · Mantén clic der. defender · ` +
      `E escuadra atacar · R fogata · B base · Tab cambiar soldado · 1-5 o G estante · M montar · Rueda zoom</span>` +
      `<span class="touchhelp">Joystick: mover · Botones: atacar, defender y órdenes a tu escuadra</span>`;
  }

  // ---------- Mini mapa ----------
  const mini = document.getElementById('mini');
  const mctx = mini.getContext('2d');
  const MW = mini.width, MH = mini.height;
  const msx = MW / VW, msy = MH / VH;
  const miniBg = document.createElement('canvas');
  miniBg.width = MW; miniBg.height = MH;
  (function buildMiniBg() {
    const g = miniBg.getContext('2d');
    g.fillStyle = '#43702c'; g.fillRect(0, 0, MW, MH);
    g.translate(-X0 * msx, -Y0 * msy);
    g.fillStyle = '#6b4a2b';
    for (const w of WALLS) g.fillRect(w.x * msx, w.y * msy, Math.max(1, w.w * msx), Math.max(1, w.h * msy));
    for (const c of CLEARINGS) {
      g.fillStyle = '#8a7a4c';
      g.beginPath(); g.arc(c.x * msx, c.y * msy, c.r * msx, 0, TAU); g.fill();
    }
    for (const d of decor) {
      if (d.type === 'tree') {
        g.fillStyle = '#1f4d1c'; g.beginPath(); g.arc(d.x * msx, d.y * msy, Math.max(1, d.r * msx * 1.1), 0, TAU); g.fill();
      } else if (d.type === 'bush') {
        g.fillStyle = '#4a9a3a'; g.beginPath(); g.arc(d.x * msx, d.y * msy, Math.max(0.8, d.r * msx * 0.9), 0, TAU); g.fill();
      }
    }
  })();

  function renderMini() {
    mctx.drawImage(miniBg, 0, 0);
    mctx.save();
    mctx.translate(-X0 * msx, -Y0 * msy);
    mctx.fillStyle = '#7a5230';
    mctx.fillRect(RACK_POS.x * msx - 2, RACK_POS.y * msy - 2, 4, 4);
    mctx.fillStyle = '#ff9f1c';
    mctx.beginPath(); mctx.arc(FIRE.x * msx, FIRE.y * msy, 3, 0, TAU); mctx.fill();
    for (const u of units) {
      const px = u.x * msx, py = u.y * msy;
      if (u.dead) {
        mctx.fillStyle = '#888'; mctx.beginPath(); mctx.arc(px, py, 2, 0, TAU); mctx.fill();
        continue;
      }
      mctx.fillStyle = u.team === 'enemy' ? '#ff4d4d' : '#4da6ff';
      mctx.beginPath(); mctx.arc(px, py, 3.2, 0, TAU); mctx.fill();
      if (u.ctrl) {
        mctx.strokeStyle = '#ffd966'; mctx.lineWidth = 1.5;
        mctx.beginPath(); mctx.arc(px, py, 6, 0, TAU); mctx.stroke();
      }
    }
    // Rectángulo de lo que se ve en pantalla
    const vw = W / zoom * msx, vh = H / zoom * msy;
    mctx.strokeStyle = 'rgba(255,255,255,0.85)'; mctx.lineWidth = 1;
    mctx.strokeRect(cam.x * msx - vw / 2, cam.y * msy - vh / 2, vw, vh);
    mctx.restore();
  }

  // ---------- Bucle ----------
  let last = performance.now(), hudT = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    syncRack();
    if (!ended) {
      updateUnits(dt);
      healNearFire(dt);
      healerPulse(dt);
      houseHeal(dt);
      updateArrows(dt);
      for (const e of effects) e.t += dt;
      for (let i = effects.length - 1; i >= 0; i--) if (effects[i].t > 0.9) effects.splice(i, 1);
      checkEnd();
    }
    if (control && !control.dead) {
      cam.x += (control.x - cam.x) * Math.min(1, dt * 5);
      cam.y += (control.y - cam.y) * Math.min(1, dt * 5);
    }
    clampCamera();
    render(now / 1000);
    renderMini();
    hudT += dt;
    if (hudT > 0.15) { hudT = 0; updateHud(); }
    requestAnimationFrame(frame);
  }

  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
