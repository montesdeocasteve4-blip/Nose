<title>Tu vs Mi</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d2b14; overflow: hidden; font-family: system-ui, sans-serif; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  #hud { position: fixed; left: 12px; top: 10px; color: #eef5e0; background: rgba(0,0,0,.45);
         padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 1.55; pointer-events: none; max-width: calc(100vw - 230px); }
  #hud b { color: #ffd966; }
  #over { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
          background: rgba(0,0,0,.5); color: #fff; font-size: 44px; font-weight: 700; cursor: pointer; }
  #over small { font-size: 16px; font-weight: 400; margin-top: 10px; }
  #touch { display: none; }
  body.touch #touch { display: block; }
  body.touch #hud { top: max(10px, env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); font-size: 12px; max-width: calc(100vw - 150px); }
  #mini { position: fixed; top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
          width: 180px; height: 124px; border: 2px solid rgba(255,255,255,.55); border-radius: 8px; background: #1d2b14; pointer-events: none; }
  body.touch #mini { width: 120px; height: 83px; }
  body.touch .keyhelp { display: none; }
  body:not(.touch) .touchhelp { display: none; }
  #touch button { font: inherit; font-size: 12px; font-weight: 600; color: #fff; background: rgba(20,30,15,.6);
                  border: 1px solid rgba(255,255,255,.4); border-radius: 10px; padding: 8px 10px; min-width: 44px; min-height: 44px;
                  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #touch button:active { background: rgba(255,217,102,.4); }
  #joyzone { position: fixed; left: 0; top: 35%; width: 50%; bottom: 0; touch-action: none; }
  #joy { position: fixed; width: 140px; height: 140px; margin: -70px 0 0 -70px; border-radius: 50%;
         background: rgba(0,0,0,.25); border: 2px solid rgba(255,255,255,.4); pointer-events: none; }
  #joy[hidden] { display: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
          background: rgba(255,255,255,.6); pointer-events: none; }
  #ring { position: fixed; right: max(8px, env(safe-area-inset-right, 0px)); bottom: max(8px, env(safe-area-inset-bottom, 0px));
          width: 210px; height: 210px; pointer-events: none; }
  #ring button, #zoombtn { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center;
          pointer-events: auto; font: inherit; font-size: 11px; font-weight: 700; letter-spacing: .02em; line-height: 1.1;
          color: #fff3dc; padding: 0; min-width: 0; min-height: 0; border-radius: 50%;
          border: 2px solid rgba(255,190,90,.55);
          background: radial-gradient(circle at 35% 30%, rgba(96,64,38,.95), rgba(26,18,10,.93));
          box-shadow: 0 0 14px rgba(255,140,40,.22), 0 6px 14px rgba(0,0,0,.4);
          touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #ring button:active, #zoombtn:active { transform: scale(.93); }
  #ring .b-atk { width: 96px; height: 96px; right: 57px; bottom: 57px; font-size: 16px;
          background: radial-gradient(circle at 35% 30%, #ff9a4d, #b8381c); border-color: #ffd28a;
          box-shadow: 0 0 22px rgba(255,130,40,.55), 0 6px 16px rgba(0,0,0,.45); }
  #ring .b-def { width: 74px; height: 74px; right: 143px; bottom: 95px; border-color: rgba(150,200,255,.6); }
  #ring .b-rack { width: 56px; height: 56px; right: 98px; bottom: 154px; font-size: 10px; }
  #ring .b-squad { width: 60px; height: 60px; right: 24px; bottom: 137px; font-size: 10px; }
  #zoombtn { position: fixed; top: calc(max(10px, env(safe-area-inset-top, 0px)) + 96px); right: max(10px, env(safe-area-inset-right, 0px));
          width: 40px; height: 40px; font-size: 10px; }
  #rack { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92vw, 360px); max-height: 80vh; overflow: auto;
          background: rgba(20,28,14,.95); color: #eef5e0; border: 1px solid rgba(255,255,255,.25); border-radius: 12px;
          padding: 12px; z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  #rack[hidden] { display: none; }
  .rk-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 15px; }
  .rk-head button { font: inherit; font-size: 13px; color: #eef5e0; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.3);
                    border-radius: 8px; min-height: 36px; padding: 0 12px; }
  .rk-item { font: inherit; color: #eef5e0; display: grid; grid-template-columns: 28px 1fr; gap: 2px 8px; align-items: center; width: 100%;
             text-align: left; padding: 8px 10px; margin-bottom: 8px; min-height: 52px; background: rgba(255,255,255,.08);
             border: 1px solid rgba(255,255,255,.25); border-radius: 10px; }
  .rk-item.on { border-color: #ffd966; background: rgba(255,217,102,.18); }
  .rk-n { grid-row: span 2; font-weight: 700; color: #ffd966; }
  .rk-name { font-weight: 600; }
  .rk-item small { grid-column: 2; opacity: .75; font-size: 12px; }
  body.touch #mini { top: max(10px, env(safe-area-inset-top, 0px)); }
</style>
<canvas id="c"></canvas>
<canvas id="mini" width="180" height="124"></canvas>
<div id="hud"></div>
<div id="touch">
  <div id="joyzone"></div>
  <div id="joy" hidden><div id="knob"></div></div>
  <div id="ring">
    <button data-act="attack" class="b-atk">Atacar</button>
    <button data-act="block" class="b-def">Defender</button>
    <button data-act="rack" class="b-rack">Armas</button>
    <button data-act="squad" class="b-squad">Esc.: ataque</button>
  </div>
  <button data-act="zoom" id="zoombtn">Zoom</button>
</div>
<div id="rack" hidden></div>
<div id="over"></div>
<script>
(() => {
  const WORLD_W = 3200, WORLD_H = 2200;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const over = document.getElementById('over');
  let W = 0, H = 0, dpr = 1;

  // ---------- Aleatorio determinista ----------
  let seed = 20240607;
  const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const R = (a, b) => a + (b - a) * rand();
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const TAU = Math.PI * 2;
  const angDiff = (a, b) => ((a - b + Math.PI) % TAU + TAU) % TAU - Math.PI;

  // ---------- Claros de spawn: orilla izquierda y esquina opuesta ----------
  // Fogata: cura a tu escuadra si está dentro del radio HEAL_R
  // Fogata en el centro del claro de la orilla izquierda; cura dentro del mismo círculo
  const FIRE = { type: 'fire', x: 260, y: WORLD_H / 2, r: 14 };
  // Estante de armas físico, cerca de la fogata
  const RACK_POS = { type: 'rack', x: 200, y: 1330, r: 30 };

  // Fortaleza de troncos alrededor de tu escuadra (2 × y 3 veces el diámetro del claro)
  const FORT = { x: 20, y: WORLD_H / 2 - 780, w: 1040, h: 1560 };
  const FX0 = FORT.x, FX1 = FORT.x + FORT.w, FY0 = FORT.y, FY1 = FORT.y + FORT.h;
  const FORT_T = 56, GATE_W = 130, FMX = FORT.x + FORT.w / 2, FMY = WORLD_H / 2;
  // Entradas: arriba, abajo y al frente (hacia el enemigo)
  const GATES = [
    { x: FMX, y: FY0 + FORT_T / 2 },
    { x: FMX, y: FY1 - FORT_T / 2 },
    { x: FX1 - FORT_T / 2, y: FMY }
  ];
  const wall = (x, y, w, h) => ({ type: 'wall', x, y, w, h, sy: y + h });
  const WALLS = [
    wall(FX0, FY0, FMX - GATE_W / 2 - FX0, FORT_T),
    wall(FMX + GATE_W / 2, FY0, FX1 - FMX - GATE_W / 2, FORT_T),
    wall(FX0, FY1 - FORT_T, FMX - GATE_W / 2 - FX0, FORT_T),
    wall(FMX + GATE_W / 2, FY1 - FORT_T, FX1 - FMX - GATE_W / 2, FORT_T),
    wall(FX1 - FORT_T, FY0, FORT_T, FMY - GATE_W / 2 - FY0),
    wall(FX1 - FORT_T, FMY + GATE_W / 2, FORT_T, FY1 - (FMY + GATE_W / 2)),
    wall(FX0, FY0, FORT_T, FORT.h)
  ];
  const insideFort = (x, y, grow = 0) => x > FX0 - grow && x < FX1 + grow && y > FY0 - grow && y < FY1 + grow;
  // Punto al que se mueve una unidad: si su objetivo está del otro lado del muro, va a la entrada más cercana
  function navPoint(u, t) {
    if (insideFort(u.x, u.y) === insideFort(t.x, t.y)) return t;
    let best = GATES[0], bd = Infinity;
    for (const g of GATES) {
      const d = Math.hypot(g.x - u.x, g.y - u.y);
      if (d < bd) { bd = d; best = g; }
    }
    return best;
  }
  // Empuja a una unidad fuera de un muro (radio 12)
  function pushOutOfWall(u, w) {
    const cx = clamp(u.x, w.x, w.x + w.w), cy = clamp(u.y, w.y, w.y + w.h);
    const dx = u.x - cx, dy = u.y - cy, d = Math.hypot(dx, dy), R = 12;
    if (d >= R) return;
    if (d > 0.001) { const k = (R - d) / d; u.x += dx * k; u.y += dy * k; return; }
    const sides = [
      [u.x - w.x, () => { u.x = w.x - R; }],
      [w.x + w.w - u.x, () => { u.x = w.x + w.w + R; }],
      [u.y - w.y, () => { u.y = w.y - R; }],
      [w.y + w.h - u.y, () => { u.y = w.y + w.h + R; }]
    ];
    sides.sort((a, b) => a[0] - b[0])[0][1]();
  }
  const HEAL_R = 260, HEAL_RATE = 10;
  const CLEARINGS = [
    { x: 260, y: WORLD_H / 2, r: 260 },
    { x: WORLD_W - 300, y: WORLD_H - 300, r: 260 }
  ];
  const inClearing = (x, y, pad) => CLEARINGS.some(c => Math.hypot(x - c.x, y - c.y) < c.r + pad);

  // ---------- Armas que un humano puede cargar ----------
  // a0 = ángulo de reposo, swing = duración del golpe (s), reach = alcance (px)
  const WEAPONS = {
    sword:      { name: 'Espada',    reach: 44, dmg: 20, cd: 0.8, swing: 0.35, speed: 112, shield: true,  a0: -1.1 },
    spear:      { name: 'Lanza',     reach: 70, dmg: 16, cd: 1.0, swing: 0.45, speed: 100, shield: false, a0: -0.1 },
    axe:        { name: 'Hacha',     reach: 40, dmg: 24, cd: 1.1, swing: 0.5,  speed: 102, shield: true,  a0: -1.0 },
    greatsword: { name: 'Espadón',   reach: 52, dmg: 30, cd: 1.4, swing: 0.55, speed: 90,  shield: false, a0: -1.0 },
    // Arco: dispara a distancia; reach/dmg son la espada corta de respaldo
    bow:        { name: 'Arco',      reach: 40, dmg: 12, cd: 1.2, swing: 0.35, speed: 100, shield: false, a0: 0,
                  ranged: { range: 380, speed: 520, dmg: 22 } }
  };

  // ---------- Decoración del bosque ----------
  const trees = [], bushes = [], decor = [];
  const isFree = (x, y, r, gap) => {
    if (inClearing(x, y, r + 20)) return false;
    if (insideFort(x, y, r + 30)) return false;
    for (const d of decor) if (Math.hypot(x - d.x, y - d.y) < d.r + r + gap) return false;
    return true;
  };
  for (let tries = 0; trees.length < 650 && tries < 6000; tries++) {
    const x = R(70, WORLD_W - 70), y = R(70, WORLD_H - 70), r = R(20, 32);
    if (isFree(x, y, r, 12)) { const t = { type: 'tree', x, y, r, v: Math.floor(rand() * 3) }; trees.push(t); decor.push(t); }
  }
  for (let tries = 0; bushes.length < 420 && tries < 6000; tries++) {
    const x = R(60, WORLD_W - 60), y = R(60, WORLD_H - 60), r = R(13, 24);
    if (isFree(x, y, r, 2)) {
      const b = { type: 'bush', x, y, r, v: Math.floor(rand() * 3), berries: rand() < 0.3 };
      bushes.push(b); decor.push(b);
    }
  }

  decor.push(FIRE, RACK_POS);

  // ---------- Suelo pre-renderizado ----------
  const ground = document.createElement('canvas');
  ground.width = WORLD_W; ground.height = WORLD_H;
  (function buildGround() {
    const g = ground.getContext('2d');
    g.fillStyle = '#43702c';
    g.fillRect(0, 0, WORLD_W, WORLD_H);
    const patch = ['#3a6626', '#4b7a33', '#37601f', '#557f38'];
    for (let i = 0; i < 420; i++) {
      g.globalAlpha = 0.3; g.fillStyle = patch[Math.floor(rand() * patch.length)];
      g.beginPath(); g.arc(R(0, WORLD_W), R(0, WORLD_H), R(40, 150), 0, TAU); g.fill();
    }
    g.globalAlpha = 0.6; g.strokeStyle = '#2c5219'; g.lineWidth = 1.2;
    for (let i = 0; i < 6000; i++) {
      const x = R(0, WORLD_W), y = R(0, WORLD_H), l = R(4, 8), a = R(-0.4, 0.4) - Math.PI / 2;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
    for (let i = 0; i < 900; i++) {
      g.globalAlpha = 0.55; g.fillStyle = rand() < 0.5 ? '#8a5a22' : '#a0702a';
      g.beginPath(); g.ellipse(R(0, WORLD_W), R(0, WORLD_H), R(1.5, 3), R(1, 2), R(0, 3), 0, TAU); g.fill();
    }
    for (const c of CLEARINGS) {
      g.globalAlpha = 0.85; g.fillStyle = '#8a7a4c';
      g.beginPath(); g.arc(c.x, c.y, c.r, 0, TAU); g.fill();
      g.globalAlpha = 0.35; g.fillStyle = '#6e5f36';
      for (let i = 0; i < 90; i++) {
        const a = R(0, TAU), d = Math.sqrt(rand()) * c.r * 0.95;
        g.beginPath(); g.arc(c.x + Math.cos(a) * d, c.y + Math.sin(a) * d, R(6, 22), 0, TAU); g.fill();
      }
      g.globalAlpha = 0.8; g.fillStyle = '#9d9274';
      for (let i = 0; i < 40; i++) {
        const a = R(0, TAU), d = Math.sqrt(rand()) * c.r * 0.9;
        g.beginPath(); g.ellipse(c.x + Math.cos(a) * d, c.y + Math.sin(a) * d, R(1.5, 3), R(1, 2), 0, 0, TAU); g.fill();
      }
    }
    g.globalAlpha = 1;
  })();

  function drawTree(t) {
    const { x, y, r, v } = t;
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(x + r * 0.35, y + 2, r * 1.1, r * 0.45, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5b3d24';
    ctx.fillRect(x - r * 0.18, y - r * 0.9, r * 0.36, r * 0.95);
    const cy = y - r * 1.5;
    const cols = ['#1f4d1c', '#27601f', '#2e7024'];
    [[0, 0, 1], [-0.55, 0.25, 0.7], [0.55, 0.2, 0.7], [0, -0.5, 0.75], [-0.3, -0.2, 0.85]].forEach(([bx, by, br], i) => {
      ctx.fillStyle = cols[(i + v) % 3];
      ctx.beginPath(); ctx.arc(x + bx * r, cy + by * r, br * r, 0, TAU); ctx.fill();
    });
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath(); ctx.arc(x - r * 0.3, cy - r * 0.5, r * 0.35, 0, TAU); ctx.fill();
  }

  function drawBush(b) {
    const { x, y, r, v } = b;
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(x, y + r * 0.3, r * 1.1, r * 0.4, 0, 0, TAU); ctx.fill();
    const cols = ['#3f8a33', '#4a9a3a', '#367c2c'];
    [[-0.5, 0, 0.6], [0.5, 0, 0.6], [0, -0.35, 0.75], [-0.2, 0.15, 0.7], [0.25, 0.1, 0.65]].forEach(([bx, by, br], i) => {
      ctx.fillStyle = cols[(i + v) % 3];
      ctx.beginPath(); ctx.arc(x + bx * r, y - r * 0.5 + by * r, br * r, 0, TAU); ctx.fill();
    });
    if (b.berries) {
      ctx.fillStyle = '#b8283a';
      for (let i = 0; i < 4; i++) {
        ctx.beginPath(); ctx.arc(x + Math.cos(i * 1.6) * r * 0.5, y - r * 0.6 + Math.sin(i * 2.1) * r * 0.4, 1.6, 0, TAU); ctx.fill();
      }
    }
  }

  // ---------- Unidades ----------
  const SPAWN_PLAYER = ['sword', 'bow', 'spear', 'axe', 'greatsword'];
  const SPAWN_ENEMY  = ['sword', 'spear', 'axe', 'sword', 'greatsword'];
  const ENEMY_POS = [[2870, 1830], [2930, 1885], [2870, 1940], [2930, 1995], [2870, 2050]];

  let units = [], player = [], enemy = [], effects = [], arrows = [];
  let control = null, ended = null;
  const mouse = { x: 0, y: 0 };
  let rmb = false;
  let touchMode = false, touchBlock = false;
  const joy = { x: 0, y: 0, id: null };
  const keys = new Set();
  const cam = { x: 0, y: 0 };
  let zoom = 1;

  function makeUnit(team, weapon, x, y, f, mode) {
    return {
      team, weapon, x, y, f, mode,
      hp: 100, dead: false,
      cd: 0, swing: 0, swingTotal: 0, hitDone: false,
      target: null, aiT: 0, blockT: 0, blocking: false,
      walkT: 0, flash: 0, vx: 0, vy: 0, ctrl: false,
      shield: WEAPONS[weapon].shield
    };
  }

  function setControl(u) {
    if (control) control.ctrl = false;
    control = u;
    u.ctrl = true;
  }

  function reset() {
    player = SPAWN_PLAYER.map((w, i) => makeUnit('player', w, 300, 1100 + (i - 2) * 120, 0, 'defend'));
    enemy = SPAWN_ENEMY.map((w, i) => makeUnit('enemy', w, ENEMY_POS[i][0], ENEMY_POS[i][1], Math.PI, 'attack'));
    units = [...player, ...enemy];
    effects = [];
    arrows = [];
    ended = null;
    over.style.display = 'none';
    setControl(player[0]);
    cam.x = control.x; cam.y = control.y;
  }

  function startSwing(u) {
    const w = WEAPONS[u.weapon];
    u.swing = w.swing; u.swingTotal = w.swing;
    u.cd = w.cd; u.hitDone = false;
  }

  function addEffect(x, y, text, color) {
    effects.push({ x, y, text, color, t: 0 });
  }

  function resolveHit(u) {
    const w = WEAPONS[u.weapon];
    const arc = u.weapon === 'spear' ? 0.6 : 1.2;
    let best = null, bd = Infinity;
    for (const e of units) {
      if (e.team === u.team || e.dead) continue;
      const dx = e.x - u.x, dy = e.y - u.y, d = Math.hypot(dx, dy);
      if (d > w.reach + 8) continue;
      if (Math.abs(angDiff(Math.atan2(dy, dx), u.f)) > arc) continue;
      if (d < bd) { bd = d; best = e; }
    }
    if (!best) return;
    const e = best;
    const toAttacker = Math.atan2(u.y - e.y, u.x - e.x);
    const facingAttacker = Math.abs(angDiff(toAttacker, e.f)) < 1.6;
    let dmg = w.dmg;
    if (e.blocking && facingAttacker) {
      // El escudo bloquea 60% del daño; sin escudo, parar con el arma bloquea 30%
      dmg = w.dmg * (e.shield ? 0.4 : 0.7);
      addEffect(e.x, e.y - 50, (e.shield ? 'ESCUDO -' : 'PARADA -') + Math.round(dmg), '#7fd3ff');
    } else {
      addEffect(e.x, e.y - 50, '-' + Math.round(dmg), '#ff6b6b');
    }
    e.hp -= dmg;
    e.flash = 0.2;
    if (e.hp <= 0) { e.hp = 0; e.dead = true; e.blocking = false; e.target = null; }
  }

  function findTarget(u) {
    const limit = u.team === 'enemy' ? 700 : (u.mode === 'attack' ? Infinity : 300);
    let best = null, bd = limit;
    for (const e of units) {
      if (e.team === u.team || e.dead) continue;
      const d = Math.hypot(e.x - u.x, e.y - u.y);
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }

  // IA de unidades que no controlas
  function think(u, dt) {
    u.aiT -= dt;
    if (u.target && u.target.dead) u.target = null;
    if (u.aiT <= 0) { u.aiT = 0.3 + rand() * 0.2; u.target = findTarget(u); }
    const t = u.target;
    if (!t) {
      // Los enemigos avanzan lentamente hacia el jugador si no hay nadie cerca
      if (u.team === 'enemy') {
        let near = null, nd = Infinity;
        for (const p of units) {
          if (p.team === u.team || p.dead) continue;
          const d = Math.hypot(p.x - u.x, p.y - u.y);
          if (d < nd) { nd = d; near = p; }
        }
        if (near && nd > 1) {
          const p = navPoint(u, near), pdx = p.x - u.x, pdy = p.y - u.y, pd = Math.hypot(pdx, pdy) || 1;
          u.vx = pdx / pd * 70; u.vy = pdy / pd * 70;
        }
      }
      return;
    }
    const w = WEAPONS[u.weapon];
    const dx = t.x - u.x, dy = t.y - u.y, d = Math.hypot(dx, dy);
    if (u.swing <= 0) u.f = Math.atan2(dy, dx);
    if (u.weapon === 'bow') {
      // El arquero mantiene distancia y dispara; si el enemigo está pegado, usa su espada corta
      if (d < 40) { if (u.cd <= 0 && u.swing <= 0) startSwing(u); }
      else if (d < 90) { u.vx = -dx / d * w.speed * 0.7; u.vy = -dy / d * w.speed * 0.7; }
      else if (d <= WEAPONS.bow.ranged.range) { if (u.cd <= 0 && u.swing <= 0) fireArrow(u, 0.05); }
      else { u.vx = dx / d * w.speed * 0.8; u.vy = dy / d * w.speed * 0.8; }
      return;
    }
    if (d > w.reach * 0.85) {
      const p = navPoint(u, t), pdx = p.x - u.x, pdy = p.y - u.y, pd = Math.hypot(pdx, pdy) || 1;
      u.vx = pdx / pd * w.speed * 0.8; u.vy = pdy / pd * w.speed * 0.8;
    } else if (u.cd <= 0 && u.swing <= 0) {
      startSwing(u);
    }
    // Decide bloquear cuando el objetivo está atacando
    if (t.swing > 0 && d < WEAPONS[t.weapon].reach + 30 && u.blockT <= 0 && rand() < 0.5) {
      u.blockT = 0.5;
    }
  }

  function updateUnits(dt) {
    const mx = cam.x + (mouse.x - W / 2) / zoom;
    const my = cam.y + (mouse.y - H / 2) / zoom;

    for (const u of units) {
      if (u.dead) continue;
      u.cd = Math.max(0, u.cd - dt);
      u.fireT = Math.max(0, (u.fireT || 0) - dt);
      u.flash = Math.max(0, u.flash - dt);
      u.blockT = Math.max(0, u.blockT - dt);

      if (u.swing > 0) {
        u.swing -= dt;
        if (!u.hitDone && u.swing <= u.swingTotal * 0.5) { u.hitDone = true; resolveHit(u); }
        if (u.swing < 0) u.swing = 0;
      }

      u.vx = 0; u.vy = 0;
      if (u.ctrl) {
        u.blocking = rmb || touchBlock;
        if (!touchMode && u.swing <= 0) u.f = Math.atan2(my - u.y, mx - u.x);
        let dx = 0, dy = 0;
        if (keys.has('a') || keys.has('arrowleft')) dx -= 1;
        if (keys.has('d') || keys.has('arrowright')) dx += 1;
        if (keys.has('w') || keys.has('arrowup')) dy -= 1;
        if (keys.has('s') || keys.has('arrowdown')) dy += 1;
        let mag = 1;
        if (dx || dy) { const l = Math.hypot(dx, dy); dx /= l; dy /= l; }
        const jm = Math.hypot(joy.x, joy.y);
        if (jm > 0.12) { dx = joy.x / jm; dy = joy.y / jm; mag = Math.min(1, jm); }
        if (touchMode && jm > 0.2 && u.swing <= 0) u.f = Math.atan2(joy.y, joy.x);
        if (dx || dy) {
          const sp = WEAPONS[u.weapon].speed * (u.blocking ? 0.4 : 1) * mag;
          u.vx = dx * sp; u.vy = dy * sp;
        }
      } else {
        u.blocking = u.blockT > 0;
        think(u, dt);
      }

      let k = 1;
      if (u.swing > 0) k = 0.3;
      if (u.blocking) k = Math.min(k, 0.4);
      u.x = clamp(u.x + u.vx * k * dt, 30, WORLD_W - 30);
      u.y = clamp(u.y + u.vy * k * dt, 30, WORLD_H - 30);
      for (const w of WALLS) pushOutOfWall(u, w);
      if (u.vx || u.vy) u.walkT += dt * 9;
    }

    // Separación: nadie atraviesa a otro
    for (let i = 0; i < units.length; i++) {
      for (let j = i + 1; j < units.length; j++) {
        const a = units[i], b = units[j];
        if (a.dead || b.dead) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy), min = 28;
        if (d < min) {
          const nx = d < 0.01 ? 1 : dx / d, ny = d < 0.01 ? 0 : dy / d;
          const push = (min - d) / 2;
          a.x -= nx * push; a.y -= ny * push;
          b.x += nx * push; b.y += ny * push;
        }
      }
    }
  }

  // ---------- Ataque, arco y flechas ----------
  function nearestEnemyDist(u) {
    let best = Infinity;
    for (const e of units) if (e.team !== u.team && !e.dead) best = Math.min(best, Math.hypot(e.x - u.x, e.y - u.y));
    return best;
  }

  function fireArrow(u, spread) {
    const R = WEAPONS.bow.ranged;
    u.cd = WEAPONS.bow.cd;
    u.fireT = 0.25;
    const a = u.f + (rand() * 2 - 1) * spread;
    arrows.push({ x: u.x, y: u.y, sx: u.x, sy: u.y, vx: Math.cos(a) * R.speed, vy: Math.sin(a) * R.speed,
                  team: u.team, range: R.range, dmg: R.dmg });
  }

  // Ataque manual o de la IA: el arco dispara, o usa la espada corta si el enemigo está pegado
  function doAttack(u) {
    if (rackOpen || u.cd > 0 || u.swing > 0) return;
    if (u.weapon === 'bow') {
      if (nearestEnemyDist(u) <= 40) startSwing(u);
      else fireArrow(u, 0.02);
      return;
    }
    startSwing(u);
  }

  function applyArrowHit(a, e) {
    const toShooter = Math.atan2(a.sy - e.y, a.sx - e.x);
    const facing = Math.abs(angDiff(toShooter, e.f)) < 1.6;
    let dmg = a.dmg;
    if (e.blocking && facing) {
      dmg = a.dmg * (e.shield ? 0.4 : 0.7);
      addEffect(e.x, e.y - 50, (e.shield ? 'ESCUDO -' : 'PARADA -') + Math.round(dmg), '#7fd3ff');
    } else {
      addEffect(e.x, e.y - 50, '-' + Math.round(dmg), '#ff6b6b');
    }
    e.hp -= dmg;
    e.flash = 0.2;
    if (e.hp <= 0) { e.hp = 0; e.dead = true; e.blocking = false; e.target = null; }
  }

  function updateArrows(dt) {
    for (let i = arrows.length - 1; i >= 0; i--) {
      const a = arrows[i];
      a.x += a.vx * dt; a.y += a.vy * dt;
      let hit = false;
      for (const e of units) {
        if (e.team === a.team || e.dead) continue;
        if (Math.hypot(e.x - a.x, e.y - a.y) <= 14) { applyArrowHit(a, e); hit = true; break; }
      }
      const far = Math.hypot(a.x - a.sx, a.y - a.sy) > a.range;
      const inWall = WALLS.some(w => a.x >= w.x && a.x <= w.x + w.w && a.y >= w.y && a.y <= w.y + w.h);
      if (hit || far || inWall || a.x < 0 || a.y < 0 || a.x > WORLD_W || a.y > WORLD_H) arrows.splice(i, 1);
    }
  }

  function drawArrows() {
    ctx.lineWidth = 1.6;
    for (const a of arrows) {
      const ang = Math.atan2(a.vy, a.vx);
      ctx.strokeStyle = '#d8d2c0';
      ctx.beginPath(); ctx.moveTo(a.x - Math.cos(ang) * 12, a.y - Math.sin(ang) * 12); ctx.lineTo(a.x, a.y); ctx.stroke();
      ctx.fillStyle = '#9aa3ad';
      ctx.beginPath(); ctx.arc(a.x, a.y, 1.8, 0, TAU); ctx.fill();
    }
  }

  function healNearFire(dt) {
    for (const u of player) {
      if (u.dead || u.hp >= 100) continue;
      if (Math.hypot(u.x - FIRE.x, u.y - FIRE.y) <= HEAL_R) u.hp = Math.min(100, u.hp + HEAL_RATE * dt);
    }
  }

  function checkEnd() {
    if (control.dead) {
      const alive = player.find(p => !p.dead);
      if (alive) setControl(alive);
    }
    if (!ended) {
      if (enemy.every(e => e.dead)) ended = 'win';
      else if (player.every(p => p.dead)) ended = 'lose';
      if (ended) {
        over.innerHTML = (ended === 'win' ? '¡Victoria!' : 'Derrota') + '<small>Clic para jugar otra vez</small>';
        over.style.display = 'flex';
      }
    }
  }

  // ---------- Dibujo de la muralla de troncos ----------
  function drawLog(x, y, w, h, shade) {
    ctx.fillStyle = shade ? '#8a6238' : '#6b4a2b';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,220,160,0.18)';
    ctx.fillRect(x, y + 1, w, h * 0.25);
    ctx.strokeStyle = '#3f2a16'; ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }
  function logEnd(cx, cy, r) {
    ctx.fillStyle = '#c49a64';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#3f2a16'; ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = 'rgba(90,60,30,0.6)';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.5, 0, TAU); ctx.stroke();
  }
  function drawWall(w) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(w.x + 5, w.y + 8, w.w, w.h);
    const L = 26;
    if (w.w >= w.h) {
      // Muro horizontal: dos hileras de troncos apilados
      const rh = w.h / 2;
      for (let r = 0; r < 2; r++) {
        for (let x = w.x, i = 0; x < w.x + w.w; x += L, i++) {
          drawLog(x, w.y + r * rh, Math.min(L, w.x + w.w - x), rh, (i + r) % 2 === 0);
        }
        logEnd(w.x, w.y + r * rh + rh / 2, rh / 2 - 1);
        logEnd(w.x + w.w, w.y + r * rh + rh / 2, rh / 2 - 1);
      }
    } else {
      // Muro vertical
      const cw = w.w / 2;
      for (let c = 0; c < 2; c++) {
        for (let y = w.y, i = 0; y < w.y + w.h; y += L, i++) {
          drawLog(w.x + c * cw, y, cw, Math.min(L, w.y + w.h - y), (i + c) % 2 === 0);
        }
        logEnd(w.x + c * cw + cw / 2, w.y, cw / 2 - 1);
        logEnd(w.x + c * cw + cw / 2, w.y + w.h, cw / 2 - 1);
      }
    }
  }

  // ---------- Dibujo del estante de armas ----------
  function drawRack(r) {
    const { x, y } = r;
    if (canUseRack()) {
      ctx.strokeStyle = 'rgba(255,217,102,0.6)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(x, y, 90, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(x, y + 3, 30, 9, 0, 0, TAU); ctx.fill();
    // postes y travesaño
    ctx.fillStyle = '#6b4a2b';
    ctx.fillRect(x - 28, y - 52, 5, 52); ctx.fillRect(x + 23, y - 52, 5, 52);
    ctx.fillStyle = '#8a6238';
    ctx.fillRect(x - 30, y - 50, 60, 5);
    // espada colgada
    ctx.fillStyle = '#dfe6ee'; ctx.fillRect(x - 20, y - 44, 2.5, 30);
    ctx.fillStyle = '#c9a227'; ctx.fillRect(x - 23, y - 15, 8, 3);
    // hacha colgada
    ctx.fillStyle = '#7a5230'; ctx.fillRect(x - 8, y - 44, 2, 30);
    ctx.fillStyle = '#b9c2cc';
    ctx.beginPath(); ctx.moveTo(x - 8, y - 44); ctx.lineTo(x - 1, y - 40); ctx.lineTo(x - 1, y - 30); ctx.lineTo(x - 8, y - 26); ctx.closePath(); ctx.fill();
    // lanza apoyada
    ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 6, y - 2); ctx.lineTo(x + 14, y - 50); ctx.stroke();
    ctx.fillStyle = '#cfd6de';
    ctx.beginPath(); ctx.moveTo(x + 12, y - 48); ctx.lineTo(x + 14, y - 58); ctx.lineTo(x + 17, y - 48); ctx.closePath(); ctx.fill();
    // arco colgado
    ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + 15, y - 42); ctx.quadraticCurveTo(x + 22, y - 28, x + 15, y - 14); ctx.stroke();
  }

  // ---------- Dibujo de la fogata ----------
  function drawFire(f, t) {
    const { x, y } = f;
    ctx.strokeStyle = 'rgba(255,200,90,0.35)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.arc(x, y, HEAL_R, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,170,60,0.12)';
    ctx.beginPath(); ctx.arc(x, y - 8, 60, 0, TAU); ctx.fill();
    ctx.fillStyle = '#3b2a1a';
    ctx.beginPath(); ctx.ellipse(x, y + 2, 14, 6, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 10, y + 1); ctx.lineTo(x + 10, y - 3); ctx.moveTo(x + 10, y + 1); ctx.lineTo(x - 10, y - 3); ctx.stroke();
    const f1 = 1 + Math.sin(t * 9) * 0.12, f2 = 1 + Math.sin(t * 13 + 1) * 0.1;
    ctx.fillStyle = '#ff9f1c';
    ctx.beginPath(); ctx.moveTo(x - 9, y - 2); ctx.quadraticCurveTo(x - 6, y - 24 * f1, x, y - 30 * f1);
    ctx.quadraticCurveTo(x + 6, y - 22 * f2, x + 9, y - 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.moveTo(x - 5, y - 2); ctx.quadraticCurveTo(x - 3, y - 14 * f2, x, y - 18 * f2);
    ctx.quadraticCurveTo(x + 3, y - 12 * f1, x + 5, y - 2); ctx.closePath(); ctx.fill();
  }

  // ---------- Dibujo de unidades ----------
  function drawShield(x, y, front, team) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#6b4a2b';
    ctx.beginPath(); ctx.ellipse(0, 0, 6, 9, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#c8c8c8'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = team === 'enemy' ? '#a8322b' : '#2f6fb0';
    ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawWeapon(u, bob) {
    const w = WEAPONS[u.weapon];
    let a = w.a0, ext = 0;
    if (u.swing > 0) {
      const p = 1 - u.swing / u.swingTotal;
      if (u.weapon === 'spear') ext = Math.sin(p * Math.PI) * 14;
      else a = w.a0 + (-0.9 + 2.2 * p);
    }
    ctx.save();
    ctx.translate(10, -22 + bob);
    ctx.rotate(a);
    // Con el arco en reposo se ve el arco; mientras golpea, la espada corta
    const kind = (u.weapon === 'bow' && u.swing > 0) ? 'sword' : u.weapon;
    if (kind === 'sword') {
      ctx.fillStyle = '#5b3d24'; ctx.fillRect(-6, -1, 6, 2);
      ctx.fillStyle = '#c9a227'; ctx.fillRect(0, -4, 2, 8);
      ctx.fillStyle = '#dfe6ee';
      ctx.beginPath(); ctx.moveTo(2, -1.6); ctx.lineTo(26, -1.2); ctx.lineTo(30, 0); ctx.lineTo(26, 1.2); ctx.lineTo(2, 1.6); ctx.fill();
    } else if (u.weapon === 'greatsword') {
      ctx.fillStyle = '#5b3d24'; ctx.fillRect(-9, -1.2, 9, 2.4);
      ctx.fillStyle = '#c9a227'; ctx.fillRect(0, -5, 2.5, 10);
      ctx.fillStyle = '#dfe6ee';
      ctx.beginPath(); ctx.moveTo(2.5, -2); ctx.lineTo(36, -1.5); ctx.lineTo(41, 0); ctx.lineTo(36, 1.5); ctx.lineTo(2.5, 2); ctx.fill();
    } else if (u.weapon === 'spear') {
      ctx.fillStyle = '#7a5230'; ctx.fillRect(-14, -1, 74 + ext, 2);
      ctx.fillStyle = '#cfd6de';
      ctx.beginPath(); ctx.moveTo(60 + ext, -3); ctx.lineTo(72 + ext, 0); ctx.lineTo(60 + ext, 3); ctx.fill();
    } else if (kind === 'bow') {
      const pull = u.fireT > 0 ? -2 : 3;
      ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(3, -11); ctx.quadraticCurveTo(9, 0, 3, 11); ctx.stroke();
      ctx.strokeStyle = '#e8e0c8'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(3, -11); ctx.lineTo(pull, 0); ctx.lineTo(3, 11); ctx.stroke();
    } else if (u.weapon === 'axe') {
      ctx.fillStyle = '#7a5230'; ctx.fillRect(-10, -1.2, 30, 2.4);
      ctx.fillStyle = '#b9c2cc';
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(18, -8); ctx.lineTo(24, -7); ctx.lineTo(23, 0); ctx.lineTo(24, 7); ctx.lineTo(18, 8); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawUnit(u, t) {
    const isEnemy = u.team === 'enemy';
    const tunic = u.flash > 0 ? '#f0e0a0' : (isEnemy ? '#a8322b' : '#2f6fb0');
    const helmet = isEnemy ? '#5a5f66' : '#9aa3ad';
    ctx.save();
    ctx.translate(u.x, u.y);

    if (u.dead) {
      ctx.fillStyle = 'rgba(120,20,20,0.45)';
      ctx.beginPath(); ctx.ellipse(0, 2, 16, 7, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = isEnemy ? '#7d2620' : '#22507f';
      ctx.fillRect(-12, -3, 18, 6);
      ctx.fillStyle = '#e0b48a';
      ctx.beginPath(); ctx.arc(-14, 0, 4.5, 0, TAU); ctx.fill();
      ctx.restore();
      return;
    }

    const flip = Math.cos(u.f) < 0 ? -1 : 1;
    ctx.scale(1.3 * flip, 1.3);
    const moving = u.vx || u.vy;
    const bob = moving ? 0 : Math.sin(t * 2 + u.x) * 0.5;
    const st = moving ? Math.sin(u.walkT) * 2 : 0;

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, 1, 11, 4.5, 0, 0, TAU); ctx.fill();

    // piernas
    ctx.fillStyle = '#4a3a2a';
    ctx.fillRect(-5 + st, -14, 4.5, 14);
    ctx.fillRect(0.5 - st, -14, 4.5, 14);

    // brazo trasero
    ctx.strokeStyle = tunic; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-4, -30 + bob); ctx.lineTo(-6, -20 + bob); ctx.stroke();

    // torso
    ctx.fillStyle = tunic;
    ctx.fillRect(-7, -33 + bob, 14, 20);
    ctx.fillStyle = '#3b2817';
    ctx.fillRect(-7, -18 + bob, 14, 2.5);

    // cabeza y casco
    ctx.fillStyle = '#e0b48a';
    ctx.beginPath(); ctx.arc(0, -38 + bob, 5.5, 0, TAU); ctx.fill();
    ctx.fillStyle = helmet;
    ctx.beginPath(); ctx.arc(0, -40 + bob, 6.2, Math.PI, 0); ctx.fill();
    ctx.fillRect(-6.2, -40 + bob, 12.4, 2);
    ctx.fillStyle = isEnemy ? '#a8322b' : '#2f6fb0';
    ctx.fillRect(-0.8, -47 + bob, 1.6, 4);

    // escudo en la espalda (si no bloquea)
    if (u.shield && !u.blocking) drawShield(-7, -22 + bob, false, u.team);

    // brazo del arma
    ctx.strokeStyle = tunic;
    ctx.beginPath(); ctx.moveTo(5, -30 + bob); ctx.lineTo(10, -22 + bob); ctx.stroke();
    drawWeapon(u, bob);

    // escudo al frente (si bloquea)
    if (u.shield && u.blocking) drawShield(14, -24 + bob, true, u.team);

    ctx.fillStyle = '#e0b48a';
    ctx.beginPath(); ctx.arc(10, -22 + bob, 2, 0, TAU); ctx.fill();
    ctx.restore();

    // barra de vida y marcador del soldado controlado
    if (u.hp < 100 || u.ctrl) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(u.x - 15, u.y - 62, 30, 5);
      ctx.fillStyle = u.hp > 50 ? '#6ccf4f' : '#e74c3c';
      ctx.fillRect(u.x - 15, u.y - 62, 30 * u.hp / 100, 5);
    }
    if (u.ctrl) {
      ctx.fillStyle = '#ffd966';
      ctx.beginPath();
      ctx.moveTo(u.x, u.y - 72); ctx.lineTo(u.x - 5, u.y - 80); ctx.lineTo(u.x + 5, u.y - 80);
      ctx.closePath(); ctx.fill();
    }
  }

  // ---------- Cámara ----------
  function clampCamera() {
    const hw = Math.min(W / 2 / zoom, WORLD_W / 2);
    const hh = Math.min(H / 2 / zoom, WORLD_H / 2);
    cam.x = clamp(cam.x, hw, WORLD_W - hw);
    cam.y = clamp(cam.y, hh, WORLD_H - hh);
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    clampCamera();
  }
  window.addEventListener('resize', resize);

  // ---------- Controles ----------
  window.addEventListener('keydown', e => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab'].includes(e.key)) e.preventDefault();
    const k = e.key.toLowerCase();
    keys.add(k);
    if (ended) return;
    if (/^[1-5]$/.test(k)) equip(RACK[Number(k) - 1]);
    else if (k === 'g') toggleRack();
    else if (k === 'e') orderAttack();
    else if (k === 'r') orderDefend();
    else if (k === 'tab') cycleControl();
  });
  window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  window.addEventListener('blur', () => { keys.clear(); rmb = false; });

  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    touchMode = false; mouse.x = e.clientX; mouse.y = e.clientY;
  });
  canvas.addEventListener('pointerdown', e => {
    // Tocar el estante físico (estando cerca) abre el menú de armas
    const wx = cam.x + (e.clientX - W / 2) / zoom, wy = cam.y + (e.clientY - H / 2) / zoom;
    if (!rackOpen && Math.hypot(wx - RACK_POS.x, wy - RACK_POS.y) < 40) { toggleRack(); return; }
    if (e.pointerType === 'touch') return; // en teléfono se ataca con el botón Atacar
    touchMode = false;
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (e.button === 0 && !ended && control && !control.dead) {
      doAttack(control);
    } else if (e.button === 2) {
      rmb = true;
    }
  });
  window.addEventListener('pointerup', e => { if (e.button === 2) rmb = false; });
  over.addEventListener('click', reset);

  // ---------- Órdenes compartidas (teclado y botones) ----------
  function orderAttack() { for (const p of player) if (!p.dead) p.mode = 'attack'; }
  function orderDefend() { for (const p of player) if (!p.dead) p.mode = 'defend'; }
  function cycleControl() {
    const alive = player.filter(p => !p.dead);
    if (alive.length) setControl(alive[(alive.indexOf(control) + 1) % alive.length]);
  }

  // ---------- Estante de armas ----------
  const RACK = ['sword', 'spear', 'axe', 'greatsword', 'bow'];
  const rack = document.getElementById('rack');
  let rackOpen = false;
  function buildRack() {
    rack.innerHTML = '<div class="rk-head"><b>Estante de armas</b><button data-rk="close">Cerrar</button></div>' +
      RACK.map((k, i) => {
        const w = WEAPONS[k];
        const info = k === 'bow' ? 'Dispara a distancia' : `Alcance ${w.reach} · Daño ${w.dmg}`;
        const on = control && control.weapon === k ? ' on' : '';
        return `<button class="rk-item${on}" data-rk="${k}">` +
               `<span class="rk-n">${i + 1}</span><span class="rk-name">${w.name}${w.shield ? ' + escudo' : ''}</span>` +
               `<small>${info}</small></button>`;
      }).join('');
  }
  function openRack() { buildRack(); rack.hidden = false; rackOpen = true; }
  function closeRack() { rack.hidden = true; rackOpen = false; }
  // El estante es físico: solo se usa estando cerca de él
  function canUseRack() {
    return !!control && !control.dead && Math.hypot(control.x - RACK_POS.x, control.y - RACK_POS.y) <= 90;
  }
  function toggleRack() {
    if (rackOpen) { closeRack(); return; }
    if (!canUseRack()) {
      if (control && !control.dead) addEffect(control.x, control.y - 60, 'Ve al estante', '#ffd966');
      return;
    }
    openRack();
  }

  // Órdenes de escuadra con un solo botón
  function squadAttacking() { return player.some(p => !p.dead && !p.ctrl && p.mode === 'attack'); }
  function toggleSquad() { if (squadAttacking()) orderDefend(); else orderAttack(); setSquadLabel(); }
  function setSquadLabel() {
    const b = document.querySelector('#ring .b-squad');
    if (b) b.textContent = squadAttacking() ? 'Esc.: ataque' : 'Esc.: defensa';
  }
  rack.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.rk === 'close') closeRack();
    else { equip(b.dataset.rk); closeRack(); }
  });
  // Cambiar de arma tarda 0.8 s (desenvainar)
  function equip(w) {
    if (ended) return;
    if (!canUseRack()) {
      if (control && !control.dead) addEffect(control.x, control.y - 60, 'Ve al estante', '#ffd966');
      return;
    }
    const u = control;
    u.weapon = w; u.shield = WEAPONS[w].shield;
    u.swing = 0; u.hitDone = false; u.cd = 0.8;
    u.blocking = false; u.blockT = 0;
    addEffect(u.x, u.y - 60, 'Cambiado: ' + WEAPONS[w].name, '#ffd966');
  }

  // ---------- Controles táctiles (teléfono) ----------
  const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  if (isTouch) document.body.classList.add('touch');
  const joyZone = document.getElementById('joyzone');
  const joyEl = document.getElementById('joy'), knob = document.getElementById('knob');
  const JOY_R = 70;
  const ZOOMS = [1, 1.5, 0.75];
  let zoomIdx = 0;
  let joyCx = 0, joyCy = 0;

  // Joystick flotante: aparece donde pones el dedo en la mitad izquierda de la pantalla
  function joyMove(e) {
    const dx = e.clientX - joyCx, dy = e.clientY - joyCy;
    const d = Math.hypot(dx, dy), m = Math.min(d, JOY_R);
    const nx = d > 0 ? dx / d : 0, ny = d > 0 ? dy / d : 0;
    const k = m / JOY_R;
    // zona muerta de 15% para no moverse por accidente
    const mag = k < 0.15 ? 0 : Math.min(1, (k - 0.15) / 0.85);
    joy.x = nx * mag; joy.y = ny * mag;
    knob.style.transform = `translate(${nx * m}px, ${ny * m}px)`;
  }
  joyZone.addEventListener('pointerdown', e => {
    e.preventDefault();
    touchMode = true; joy.id = e.pointerId;
    joyCx = e.clientX; joyCy = e.clientY;
    joyEl.style.left = joyCx + 'px'; joyEl.style.top = joyCy + 'px';
    knob.style.transform = '';
    joy.x = 0; joy.y = 0;
    joyEl.hidden = false;
    joyZone.setPointerCapture(e.pointerId);
  });
  joyZone.addEventListener('pointermove', e => { if (e.pointerId === joy.id) joyMove(e); });
  const joyEnd = e => {
    if (e.pointerId !== joy.id) return;
    joy.id = null; joy.x = 0; joy.y = 0; joyEl.hidden = true;
  };
  joyZone.addEventListener('pointerup', joyEnd);
  joyZone.addEventListener('pointercancel', joyEnd);

  document.querySelectorAll('#touch button').forEach(btn => {
    const act = btn.dataset.act;
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      touchMode = true;
      if (act === 'block') { touchBlock = true; return; }
      if (ended) return;
      if (act === 'attack') {
        if (control && !control.dead) doAttack(control);
      } else if (act === 'squad') toggleSquad();
      else if (act === 'rack') toggleRack();
      else if (act === 'zoom') { zoomIdx = (zoomIdx + 1) % ZOOMS.length; zoom = ZOOMS[zoomIdx]; clampCamera(); }
    });
    const up = () => { if (act === 'block') touchBlock = false; };
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('pointerleave', up);
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    zoom = clamp(zoom * (e.deltaY > 0 ? 0.9 : 1.1), 0.5, 2);
    clampCamera();
  }, { passive: false });

  // ---------- Render ----------
  function render(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#1d2b14';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom,
                     dpr * (W / 2 - cam.x * zoom), dpr * (H / 2 - cam.y * zoom));
    ctx.drawImage(ground, 0, 0);

    const m = 80 / zoom;
    const left = cam.x - W / 2 / zoom - m, right = cam.x + W / 2 / zoom + m;
    const top = cam.y - H / 2 / zoom - m, bottom = cam.y + H / 2 / zoom + m;
    const items = [];
    for (const d of decor) if (d.x >= left && d.x <= right && d.y >= top && d.y <= bottom) items.push(d);
    for (const u of units) if (u.x >= left && u.x <= right && u.y >= top && u.y <= bottom) items.push(u);
    for (const w of WALLS) items.push(w);
    items.sort((a, b) => (a.sy ?? a.y) - (b.sy ?? b.y));
    for (const it of items) {
      if (it.type === 'tree') drawTree(it);
      else if (it.type === 'bush') drawBush(it);
      else if (it.type === 'fire') drawFire(it, t);
      else if (it.type === 'rack') drawRack(it);
      else if (it.type === 'wall') drawWall(it);
      else drawUnit(it, t);
    }

    drawArrows();

    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    for (const e of effects) {
      ctx.globalAlpha = Math.max(0, 1 - e.t / 0.9);
      ctx.fillStyle = e.color;
      ctx.fillText(e.text, e.x, e.y - e.t * 30);
    }
    ctx.globalAlpha = 1;
  }

  function updateHud() {
    setSquadLabel();
    const pa = player.filter(p => !p.dead).length;
    const ea = enemy.filter(e => !e.dead).length;
    hud.innerHTML =
      `<b>Controlas:</b> ${WEAPONS[control.weapon].name} · vida ${Math.ceil(control.hp)}` +
      `${control.blocking ? ' · <b>bloqueando</b>' : ''}<br>` +
      `Tu escuadra (azul): ${pa}/5 · Enemigo (rojo): ${ea}/5<br>` +
      `<span class="keyhelp">WASD mover · Mouse apuntar · Clic izq. atacar · Mantén clic der. defender · ` +
      `E escuadra atacar · R escuadra defender · Tab cambiar soldado · 1-5 o G estante de armas · Rueda zoom</span>` +
      `<span class="touchhelp">Joystick: mover · Botones: atacar, defender y órdenes a tu escuadra</span>`;
  }

  // ---------- Mini mapa ----------
  const mini = document.getElementById('mini');
  const mctx = mini.getContext('2d');
  const MW = mini.width, MH = mini.height;
  const msx = MW / WORLD_W, msy = MH / WORLD_H;
  const miniBg = document.createElement('canvas');
  miniBg.width = MW; miniBg.height = MH;
  (function buildMiniBg() {
    const g = miniBg.getContext('2d');
    g.fillStyle = '#43702c'; g.fillRect(0, 0, MW, MH);
    g.fillStyle = '#6b4a2b';
    for (const w of WALLS) g.fillRect(w.x * msx, w.y * msy, Math.max(1, w.w * msx), Math.max(1, w.h * msy));
    for (const c of CLEARINGS) {
      g.fillStyle = '#8a7a4c';
      g.beginPath(); g.arc(c.x * msx, c.y * msy, c.r * msx, 0, TAU); g.fill();
    }
    for (const d of decor) {
      if (d.type === 'tree') {
        g.fillStyle = '#1f4d1c'; g.beginPath(); g.arc(d.x * msx, d.y * msy, Math.max(1, d.r * msx * 1.1), 0, TAU); g.fill();
      } else if (d.type === 'bush') {
        g.fillStyle = '#4a9a3a'; g.beginPath(); g.arc(d.x * msx, d.y * msy, Math.max(0.8, d.r * msx * 0.9), 0, TAU); g.fill();
      }
    }
  })();

  function renderMini() {
    mctx.drawImage(miniBg, 0, 0);
    mctx.fillStyle = '#7a5230';
    mctx.fillRect(RACK_POS.x * msx - 2, RACK_POS.y * msy - 2, 4, 4);
    mctx.fillStyle = '#ff9f1c';
    mctx.beginPath(); mctx.arc(FIRE.x * msx, FIRE.y * msy, 3, 0, TAU); mctx.fill();
    for (const u of units) {
      const px = u.x * msx, py = u.y * msy;
      if (u.dead) {
        mctx.fillStyle = '#888'; mctx.beginPath(); mctx.arc(px, py, 2, 0, TAU); mctx.fill();
        continue;
      }
      mctx.fillStyle = u.team === 'enemy' ? '#ff4d4d' : '#4da6ff';
      mctx.beginPath(); mctx.arc(px, py, 3.2, 0, TAU); mctx.fill();
      if (u.ctrl) {
        mctx.strokeStyle = '#ffd966'; mctx.lineWidth = 1.5;
        mctx.beginPath(); mctx.arc(px, py, 6, 0, TAU); mctx.stroke();
      }
    }
    // Rectángulo de lo que se ve en pantalla
    const vw = W / zoom * msx, vh = H / zoom * msy;
    mctx.strokeStyle = 'rgba(255,255,255,0.85)'; mctx.lineWidth = 1;
    mctx.strokeRect(cam.x * msx - vw / 2, cam.y * msy - vh / 2, vw, vh);
  }

  // ---------- Bucle ----------
  let last = performance.now(), hudT = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!ended && !rackOpen) {
      updateUnits(dt);
      healNearFire(dt);
      updateArrows(dt);
      for (const e of effects) e.t += dt;
      for (let i = effects.length - 1; i >= 0; i--) if (effects[i].t > 0.9) effects.splice(i, 1);
      checkEnd();
    }
    if (control && !control.dead) {
      cam.x += (control.x - cam.x) * Math.min(1, dt * 5);
      cam.y += (control.y - cam.y) * Math.min(1, dt * 5);
    }
    clampCamera();
    render(now / 1000);
    renderMini();
    hudT += dt;
    if (hudT > 0.15) { hudT = 0; updateHud(); }
    requestAnimationFrame(frame);
  }

  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
